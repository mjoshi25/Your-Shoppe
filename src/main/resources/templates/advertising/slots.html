<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><body>
<section class="sponsored-slot" th:fragment="banners(ads)" th:if="${ads != null and !#lists.isEmpty(ads)}" aria-label="Sponsored promotions"><article class="sponsored-ad" th:each="ad : ${ads}"><a class="sponsored-ad-link" th:href="@{/ads/click/{id}(id=${ad.id})}" rel="nofollow"><picture><source th:if="${ad.mobileBannerUrl != null and !#strings.isEmpty(ad.mobileBannerUrl)}" media="(max-width: 680px)" th:srcset="${ad.mobileBannerUrl}"><img th:src="${ad.bannerUrl}" th:alt="${ad.title}" loading="lazy"></picture><span class="sponsored-ad-copy"><strong th:text="${ad.title}">Promotion</strong><span th:if="${ad.description != null and !#strings.isEmpty(ad.description)}" th:text="${ad.description}">Description</span><b th:text="${ad.callToAction}">Shop now</b></span></a><span class="sponsored-label">Sponsored</span><img class="ad-impression-pixel" th:src="@{/ads/impression/{id}(id=${ad.id})}" alt="" width="1" height="1"></article></section>
</body></html>
