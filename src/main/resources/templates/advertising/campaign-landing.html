<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${campaign.title} + ' · ASMJ Shoppe'">Campaign · ASMJ Shoppe</title>
<link rel="stylesheet" th:href="@{/css/app.css(v=78)}">
<style>
.campaign-wrap{max-width:1200px;margin:24px auto;padding:0 16px}.campaign-hero{width:100%;max-height:360px;object-fit:cover;border-radius:18px}.campaign-heading{margin:24px 0}.campaign-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}.campaign-product{border:1px solid #e8e2ee;border-radius:14px;padding:12px;background:#fff;color:inherit;text-decoration:none;min-width:0}.campaign-product img{width:100%;height:190px;object-fit:contain}.campaign-product h3{font-size:1rem;margin:10px 0}.campaign-empty{padding:28px;text-align:center;background:#faf7fc;border-radius:14px}@media(max-width:520px){.campaign-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.campaign-product img{height:135px}}
</style></head>
<body><div th:replace="~{fragments/layout :: header}"></div>
<main class="campaign-wrap"><img class="campaign-hero" th:src="${campaign.bannerUrl}" th:alt="${campaign.title}">
<header class="campaign-heading"><p class="eyebrow">FEATURED CAMPAIGN</p><h1 th:text="${campaign.title}">Campaign</h1><p th:text="${campaign.description}"></p></header>
<section class="campaign-grid" th:if="${!#lists.isEmpty(products)}"><a class="campaign-product" th:each="p : ${products}" th:href="@{/products/{id}(id=${p.id})}"><img th:src="${p.imageUrl}" th:alt="${p.name}" loading="lazy"><h3 th:text="${p.name}">Product</h3><strong th:text="|₹${p.price}|">₹0</strong></a></section>
<div class="campaign-empty" th:if="${#lists.isEmpty(products)}"><h2>Products currently unavailable</h2><p>This campaign has no active products at the moment. Please explore other products.</p><a class="btn market-primary" th:href="@{/products}">Browse products</a></div>
</main><footer class="site-footer"><span>© ASMJ Shoppe</span><span>One Platform. Many Possibilities.</span></footer></body></html>
