<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your cart | ASMJ Marketplace</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap"><div class="eyebrow">SHOPPING</div><h1>Your cart</h1><div class="notice error" th:if="${errorMessage}" th:text="${errorMessage}"></div><div class="notice success" th:if="${successMessage}" th:text="${successMessage}"></div><section class="panel" th:if="${#lists.isEmpty(cartItems)}"><h2>Your cart is empty</h2><p class="muted">Explore products and add something you like.</p><a class="btn primary" th:href="@{/products}">Explore products</a></section><div th:unless="${#lists.isEmpty(cartItems)}" class="panel"><div class="cart-row" th:each="row : ${cartItems}"><img class="cart-thumb" th:src="${row.product.imageUrl}" th:alt="${row.product.name}"><div class="cart-info"><b th:text="${row.product.name}">Product</b><small th:text="${'₹'+#numbers.formatDecimal(row.product.price,1,2)+' each'}"></small><form class="inline-form" method="post" th:action="@{/cart/update}"><input type="hidden" name="productId" th:value="${row.product.id}"><input type="number" name="quantity" min="0" max="50" th:value="${row.quantity}" aria-label="Quantity"><button class="btn secondary small-btn">Update</button></form></div><strong th:text="${'₹'+#numbers.formatDecimal(row.lineTotal,1,2)}">₹0</strong></div><div class="cart-total"><span>Subtotal</span><strong th:text="${'₹'+#numbers.formatDecimal(subtotal,1,2)}"></strong></div><p class="muted">Orders currently contain products from one vendor at a time. Delivery charge, if applicable, is added at checkout.</p><div class="actions"><a class="btn primary" th:href="@{/checkout}">Proceed to checkout</a><form method="post" th:action="@{/cart/clear}"><button class="btn secondary">Clear cart</button></form><a class="btn secondary" th:href="@{/products}">Continue shopping</a></div></div></main></body></html>
