<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" type="image/x-icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/favicon-192.png"><meta name="theme-color" content="#541477"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Track order | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap"><div class="eyebrow">ORDER TRACKING</div><h1 th:text="${'Order '+order.orderNumber}">Order tracking</h1><div class="panel tracking-summary"><div><span class="muted">Current status</span><h2 class="status-pill" th:text="${order.status}">PLACED</h2></div><div><span class="muted">Order total</span><h2 th:text="${'₹'+#numbers.formatDecimal(order.total,1,2)}">₹0</h2></div><div><span class="muted">Payment</span><h3 th:text="${order.paymentMethod+' / '+order.paymentStatus}">COD</h3></div></div><section class="panel"><h2>Order journey</h2><div class="timeline" th:if="${!#lists.isEmpty(order.statusHistory)}"><div class="timeline-item" th:each="event : ${order.statusHistory}"><span class="timeline-dot"></span><div><b th:text="${event.status}">PLACED</b><p th:text="${event.note}"></p><small th:text="${#temporals.format(event.createdAt,'dd MMM yyyy, hh:mm a')+' · '+event.updatedBy}"></small></div></div></div><div class="notice" th:if="${#lists.isEmpty(order.statusHistory)}">This order predates status timeline tracking. Current status: <b th:text="${order.status}"></b></div></section><section class="panel"><h2>Delivery details</h2><p><b th:text="${order.fulfilmentMethod == 'DELIVERY' ? 'Home delivery' : 'Shop pickup'}"></b></p><p th:if="${order.fulfilmentMethod == 'DELIVERY'}" th:text="${order.deliveryAddress+', '+order.deliveryCity+', '+order.deliveryState+' - '+order.deliveryPinCode}"></p><p>Vendor: <b th:text="${order.vendorName}"></b></p><p>Placed: <span th:text="${#temporals.format(order.createdAt,'dd MMM yyyy, hh:mm a')}"></span></p><div class="actions"><a class="btn primary" th:href="@{/orders/{id}/invoice(id=${order.id})}" target="_blank">View invoice</a><a class="btn secondary" th:href="@{/customer/orders}">Back to my orders</a></div></section></main></body></html>
