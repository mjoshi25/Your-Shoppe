<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${'Invoice '+order.orderNumber}">Invoice</title><style>body{font-family:Arial,sans-serif;color:#1f2937;margin:0;background:#f3f5f9}.invoice{max-width:850px;margin:28px auto;background:#fff;padding:38px;border:1px solid #e5e7eb;border-radius:12px}.invoice-head{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #e5eaf2;padding-bottom:20px}.brand{font-size:24px;font-weight:800;color:#284d91}.muted{color:#64748b;font-size:13px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:24px 0}.meta p{margin:6px 0}table{width:100%;border-collapse:collapse;margin:24px 0}th,td{padding:12px;border-bottom:1px solid #e5eaf2;text-align:left}th{background:#f7f9fc}td:last-child,th:last-child{text-align:right}.totals{max-width:320px;margin-left:auto}.totals div{display:flex;justify-content:space-between;padding:8px 0}.grand{font-size:19px;font-weight:800;border-top:2px solid #334155}.actions{display:flex;justify-content:flex-end;margin-bottom:18px}.print-btn{background:#284d91;color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer}@media(max-width:600px){.invoice{margin:0;padding:18px;border-radius:0}.invoice-head,.meta{grid-template-columns:1fr;display:grid}.invoice-head{gap:8px}}@media print{body{background:#fff}.invoice{margin:0;max-width:none;border:0;border-radius:0;padding:0}.actions{display:none}}</style></head><body><main class="invoice"><div class="actions"><button class="print-btn" onclick="window.print()">Print / Save as PDF</button></div><header class="invoice-head"><div><div class="brand">ASMJ MARKETPLACE</div><p class="muted">Order invoice / receipt</p></div><div style="text-align:right"><h2>INVOICE</h2><b th:text="${order.orderNumber}">ASMJ-ORDER</b><p class="muted" th:text="${#temporals.format(order.createdAt,'dd MMM yyyy')}"></p></div></header><section class="meta"><div><b>Bill to</b><p th:text="${order.customerName}"></p><p th:text="${order.customerMobile}"></p><p th:text="${order.customerEmail}"></p></div><div><b>Sold by</b><p th:text="${order.vendorName}"></p><p th:text="${order.fulfilmentMethod == 'DELIVERY' ? order.deliveryAddress+', '+order.deliveryCity+', '+order.deliveryState+' - '+order.deliveryPinCode : 'Shop pickup'}"></p></div></section><table><thead><tr><th>Item</th><th>Qty</th><th>Unit price</th><th>Amount</th></tr></thead><tbody><tr th:each="item : ${order.items}"><td th:text="${item.productName}"></td><td th:text="${item.quantity}"></td><td th:text="${'₹'+#numbers.formatDecimal(item.unitPrice,1,2)}"></td><td th:text="${'₹'+#numbers.formatDecimal(item.lineTotal,1,2)}"></td></tr></tbody></table><section class="totals"><div><span>Subtotal</span><b th:text="${'₹'+#numbers.formatDecimal(order.subtotal,1,2)}"></b></div><div><span>Delivery</span><b th:text="${'₹'+#numbers.formatDecimal(order.deliveryCharge,1,2)}"></b></div><div class="grand"><span>Total</span><b th:text="${'₹'+#numbers.formatDecimal(order.total,1,2)}"></b></div></section><section class="meta"><div><b>Payment</b><p th:text="${order.paymentMethod+' / '+order.paymentStatus}"></p><p th:if="${order.upiReference != null}" th:text="${'UTR: '+order.upiReference}"></p></div><div><b>Order status</b><p th:text="${order.status}"></p><p class="muted">Thank you for shopping with ASMJ Marketplace.</p></div></section></main></body></html>
