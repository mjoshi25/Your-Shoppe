<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Request Emergency Assistance | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css(v=56)}"><script defer th:src="@{/js/master-data-dropdowns.js}"></script></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="page-shell"><h1>Request emergency assistance</h1><div class="alert alert-error"><strong>Do not wait for this form in an immediate emergency.</strong> Call 112 in India. Submitting this request does not guarantee provider acceptance or dispatch.</div><div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div><form class="form-card" method="post" th:action="@{/emergency/requests}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Emergency category<select name="categoryCode" data-master-group="EMERGENCY_CATEGORY" required><option value="">Choose category</option></select></label><label>Subcategory<select name="subcategoryCode" data-master-group="EMERGENCY_SUBCATEGORY"><option value="">Choose subcategory</option></select></label><label>State<select id="reqState" name="stateCode" data-master-group="INDIA_STATE" required><option value="">Choose State</option></select></label><label>City<select id="reqCity" name="cityCode" data-master-group="INDIA_CITY" data-parent-select="#reqState" required><option value="">Choose City</option></select></label><label>PIN code<select id="reqPin" name="pincode" data-master-group="INDIA_PINCODE" data-parent-select="#reqCity" required><option value="">Choose PIN code</option></select></label><label>Full address / landmark<input name="address" required maxlength="400"></label><label>Contact phone<input name="customerPhone" required type="tel" maxlength="15"></label><label>Describe the assistance required<textarea name="description" rows="4" required maxlength="1500"></textarea></label><button class="btn btn-primary" type="submit">Submit assistance request</button></form></main></body></html>
