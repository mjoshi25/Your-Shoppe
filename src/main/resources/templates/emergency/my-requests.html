<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Emergency Requests | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="page-shell"><h1>My emergency assistance requests</h1><div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div><article class="service-card" th:each="r:${requests}"><h2 th:text="${r.categoryLabel}">Category</h2><p th:text="${r.cityLabel + ', ' + r.stateLabel + ' - ' + r.pincode}">Location</p><p th:text="${r.description}">Description</p><strong th:text="${r.status}">REQUESTED</strong><small th:text="${#temporals.format(r.createdAt,'dd MMM yyyy HH:mm')}">Date</small></article><p class="empty-state" th:if="${#lists.isEmpty(requests)}">You have not submitted any assistance requests.</p></main></body></html>
