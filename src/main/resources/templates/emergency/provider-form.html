<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Emergency Provider Registration | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css(v=56)}"><script defer th:src="@{/js/master-data-dropdowns.js}"></script></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="page-shell"><h1>Emergency service provider profile</h1><p>Submit your details and supporting documents. Your listing becomes public only after Admin approval.</p><div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div><form class="form-card" method="post" enctype="multipart/form-data" th:action="@{/emergency/providers/register}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Provider / organisation name<input name="providerName" required maxlength="120" th:value="${provider.providerName}"></label><label>Provider type<select name="providerType"><option value="INDIVIDUAL">Individual</option><option value="ORGANISATION">Organisation</option><option value="GOVERNMENT">Government / public contact</option></select></label><label>Contact person<input name="contactPerson" th:value="${provider.contactPerson}"></label><label>Phone<input name="phone" required type="tel" maxlength="15" th:value="${provider.phone}"></label><label>Alternate phone<input name="alternatePhone" th:value="${provider.alternatePhone}"></label><label>Email<input name="email" type="email" th:value="${provider.email}"></label><label>Emergency category<select name="categoryCode" data-master-group="EMERGENCY_CATEGORY" required><option value="">Choose category</option></select></label><label>Subcategory<select name="subcategoryCode" data-master-group="EMERGENCY_SUBCATEGORY"><option value="">Choose subcategory</option></select></label><label>State<select id="emState" name="stateCode" data-master-group="INDIA_STATE" required><option value="">Choose State</option></select></label><label>City<select id="emCity" name="cityCode" data-master-group="INDIA_CITY" data-parent-select="#emState" required><option value="">Choose City</option></select></label><label>PIN code<select id="emPin" name="pincode" data-master-group="INDIA_PINCODE" data-parent-select="#emCity" required><option value="">Choose PIN code</option></select></label><label>Additional serviceable PIN codes (comma separated)<input name="servicePincodes" placeholder="751001, 766001"></label><label>Operating hours<input name="operatingHours" placeholder="e.g. 8 AM – 10 PM" th:value="${provider.operatingHours}"></label><label>Availability<select name="availability"><option value="AVAILABLE">Available</option><option value="BUSY">Busy</option><option value="UNAVAILABLE">Unavailable</option></select></label><label><input type="checkbox" name="available24x7" value="true"> Available 24/7</label><label>Charges / pricing disclosure<input name="charges" placeholder="Call for estimate / starting charge" th:value="${provider.charges}"></label><label>Description<textarea name="description" rows="4" maxlength="1500" th:text="${provider.description}"></textarea></label><label>Verification documents (PDF/JPG/PNG/DOC/DOCX, max 8 MB each)<input type="file" name="documents" multiple accept=".pdf,.jpg,.jpeg,.png,.webp,.doc,.docx"></label><button class="btn btn-primary" type="submit">Submit for Admin verification</button></form><p th:if="${provider.id != null}">Current profile status: <strong th:text="${provider.status}">Status</strong></p></main></body></html>
