<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fulfilment settings | ASMJ Marketplace</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header>
<main class="dashboard-wrap"><div class="eyebrow">VENDOR CENTRE</div><h1>Pickup & delivery settings</h1>
<p class="muted">Choose how customers can receive orders from your shop. You can enable either option or both.</p>
<div class="notice success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="notice error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
<section class="panel"><form th:action="@{/vendor/settings/fulfilment}" method="post">
<label class="fulfilment-choice"><input type="checkbox" name="homeDelivery" value="true" th:checked="${vendorProfile.homeDelivery}"><span><b>Home Delivery</b><small>Customers can request delivery to their address. Delivery charges and service areas can be configured in the delivery phase.</small></span></label>
<label class="fulfilment-choice"><input type="checkbox" name="pickupFromShop" value="true" th:checked="${vendorProfile.pickupFromShop}"><span><b>Pickup from Shop</b><small>Customers can collect their order directly from your shop.</small></span></label>
<label>Home delivery charge (₹)<input type="number" name="deliveryCharge" min="0" max="100000" step="0.01" th:value="${vendorProfile.deliveryCharge == null ? 0 : vendorProfile.deliveryCharge}" required><small>Applied once per order for home delivery. Pickup orders have no delivery charge.</small></label><label>UPI ID (optional)<input name="upiId" maxlength="100" th:value="${vendorProfile.upiId}" placeholder="shopname@upi"><small>Displayed to buyers choosing UPI. Payments are manually reviewed by admin.</small></label><div class="actions"><button class="btn primary" type="submit">Save fulfilment options</button><a class="btn secondary" th:href="@{/vendor/products}">Back to products</a></div>
</form></section></main></body></html>
