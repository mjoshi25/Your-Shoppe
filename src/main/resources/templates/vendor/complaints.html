<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Customer complaints | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css(v=58)}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap" id="main-content"><h1>Customer complaints</h1><p class="muted">View complaints associated with your orders. ASMJ Shoppe support manages the resolution.</p><section class="panel" th:each="c : ${complaints}"><h2 th:text="${c.subject+' · '+c.orderNumber}"></h2><p th:text="${c.description}"></p><p><b>Status:</b> <span th:text="${c.status}"></span></p><p th:if="${c.adminNote != null and !#strings.isEmpty(c.adminNote)}"><b>Support update:</b> <span th:text="${c.adminNote}"></span></p></section><p th:if="${#lists.isEmpty(complaints)}">No complaints have been associated with your orders.</p></main></body></html>
