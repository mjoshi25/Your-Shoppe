<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor financial ledger</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="jobs-page"><section class="jobs-hero"><h1>Marketplace charges & settlements</h1><p>Submit a UTR/reference after paying ASMJ Marketplace. Entries remain payable until Admin verifies them.</p></section><section class="job-panel"><div th:if="${success}" th:text="${success}"></div><div th:if="${error}" th:text="${error}"></div><div class="table-responsive"><table><thead><tr><th>Reference</th><th>Component</th><th>Payer → Payee</th><th>Amount</th><th>Status</th><th>Submit payment</th></tr></thead><tbody><tr th:each="e : ${entries}"><td th:text="${e.referenceNumber}"></td><td th:text="${e.component}"></td><td th:text="${e.payerType+' → '+e.payeeType}"></td><td th:text="${'₹'+e.amount}"></td><td th:text="${e.paymentStatus+' / '+e.settlementStatus}"></td><td><form th:if="${e.paymentStatus == 'PAYABLE'}" method="post" th:action="@{'/vendor/financial-ledger/'+${e.id}+'/submit-payment'}"><input name="transactionReference" required maxlength="100" placeholder="UPI UTR / bank reference"><select name="paymentMethod"><option>UPI</option><option>BANK_TRANSFER</option><option>OTHER</option></select><input name="proofUrl" maxlength="500" placeholder="Optional proof URL"><button type="submit">Submit for verification</button></form><span th:if="${e.paymentStatus != 'PAYABLE'}">—</span></td></tr></tbody></table></div><p th:if="${#lists.isEmpty(entries)}">No marketplace charges are currently recorded.</p></section></main></body></html>
