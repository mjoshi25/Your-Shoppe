<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rental bookings | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap rental-wrap"><div class="eyebrow">VEHICLE OWNER WORKSPACE</div><h1>Rental booking requests</h1><div class="notice success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="notice error" th:if="${errorMessage}" th:text="${errorMessage}"></div><article class="panel rental-booking-card" th:each="b : ${bookings}"><div class="order-head"><div><b th:text="${b.bookingNumber}"></b><small th:text="${b.customerName+' · '+b.customerMobile}"></small></div><span class="status-pill" th:text="${b.status}"></span></div><p><b>Vehicle:</b> <span th:text="${b.vehicleName+' ('+b.vehicleCategory+')'}"></span></p><p><b>Pickup:</b> <span th:text="${b.pickupAddress+' · '+b.pickupPinCode}"></span></p><p><b>Drop:</b> <span th:text="${b.dropAddress+' · '+b.dropPinCode}"></span></p><p><b>Route:</b> <span th:text="${#numbers.formatDecimal(b.distanceKm,1,2)+' km one way · '+b.tripType}"></span></p><p><b>Schedule:</b> <span th:text="${b.pickupDate+' '+b.pickupTime}"></span><span th:if="${b.returnDate != null}" th:text="${' · Return '+b.returnDate+' '+b.returnTime}"></span></p><p><b>Passengers:</b> <span th:text="${b.passengers}"></span> · <b>Estimate:</b> <span th:text="${'₹'+#numbers.formatDecimal(b.estimatedFare,1,2)}"></span></p><p th:text="${b.customerNote}"></p><div class="inline-actions" th:if="${b.status == 'REQUESTED'}"><form method="post" th:action="@{/vendor/rentals/bookings/{id}/decision(id=${b.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="decision" value="ACCEPT"><label>Final fare (₹)<input type="number" name="ownerQuotedFare" min="0" max="10000000" step="0.01" th:value="${b.estimatedFare}" required></label><button class="btn primary small-btn">Accept &amp; quote fare</button></form><form method="post" th:action="@{/vendor/rentals/bookings/{id}/decision(id=${b.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="decision" value="REJECT"><button class="btn danger small-btn">Reject request</button></form></div><p class="muted" th:if="${b.ownerResponseNote != null}" th:text="${b.ownerResponseNote}"></p></article><section class="panel" th:if="${#lists.isEmpty(bookings)}"><h2>No rental requests yet</h2></section></main></body></html>
