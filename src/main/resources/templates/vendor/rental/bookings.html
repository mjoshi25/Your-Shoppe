<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<meta name="theme-color" content="#421064">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rental bookings | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css(v=56)}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap rental-wrap"><div class="eyebrow">VEHICLE OWNER WORKSPACE</div><h1>Rental booking requests</h1><div class="notice success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="notice error" th:if="${errorMessage}" th:text="${errorMessage}"></div><article class="panel rental-booking-card" th:each="b : ${bookings}"><div class="order-head"><div><b th:text="${b.bookingNumber}"></b><small th:text="${b.customerName+' · '+b.customerMobile}"></small></div><span class="status-pill" th:text="${b.status}"></span></div><p><b>Vehicle:</b> <span th:text="${b.vehicleName+' ('+b.vehicleCategory+' / '+b.vehicleSubcategory+')'}"></span></p><p><b>Pickup:</b> <span th:text="${b.pickupAddress+' · '+b.pickupPinCode}"></span> · <a target="_blank" rel="noopener" th:href="${'https://www.google.com/maps/search/?api=1&query='+b.pickupLatitude+','+b.pickupLongitude}">Map</a></p><p><b>Drop:</b> <span th:text="${b.dropAddress+' · '+b.dropPinCode}"></span> · <a target="_blank" rel="noopener" th:href="${'https://www.google.com/maps/search/?api=1&query='+b.dropLatitude+','+b.dropLongitude}">Map</a></p><p><b>Route:</b> <span th:text="${#numbers.formatDecimal(b.distanceKm,1,2)+' km one way · '+b.tripType}"></span></p><p><b>Schedule:</b> <span th:text="${b.pickupDate+' '+b.pickupTime}"></span><span th:if="${b.returnDate != null}" th:text="${' · Return '+b.returnDate+' '+b.returnTime}"></span></p><p><b>Passengers:</b> <span th:text="${b.passengers}"></span> · <b>Estimate:</b> <span th:text="${'₹'+#numbers.formatDecimal(b.estimatedFare,1,2)}"></span></p><p th:text="${b.customerNote}"></p><div class="inline-actions" th:if="${b.status == 'REQUESTED'}"><form method="post" th:action="@{/vendor/rentals/bookings/{id}/decision(id=${b.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="decision" value="ACCEPT"><label>Final fare (₹)<input type="number" name="ownerQuotedFare" min="0" max="10000000" step="0.01" th:value="${b.estimatedFare}" required></label><button class="btn primary small-btn">Accept &amp; quote fare</button></form><form method="post" th:action="@{/vendor/rentals/bookings/{id}/decision(id=${b.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="decision" value="REJECT"><button class="btn danger small-btn">Reject request</button></form></div><p class="muted" th:if="${b.ownerResponseNote != null}" th:text="${b.ownerResponseNote}"></p>
<div th:if="${b.paymentStatus == 'PROOF_SUBMITTED'}" class="panel"><b>UPI payment proof</b><p th:text="${'UTR: '+b.paymentUtr+' · Amount ₹'+#numbers.formatDecimal(b.amountPaid,1,2)}"></p><a th:href="${b.paymentProofUrl}" target="_blank" rel="noopener">View payment screenshot</a><div class="inline-actions"><form method="post" th:action="@{/vendor/rentals/bookings/{id}/payment/verify(id=${b.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="decision" value="VERIFY"><button class="btn primary small-btn">Verify payment</button></form><form method="post" th:action="@{/vendor/rentals/bookings/{id}/payment/verify(id=${b.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="decision" value="REJECT"><input name="note" placeholder="Reason"><button class="btn danger small-btn">Reject proof</button></form></div></div>
<form th:if="${b.status == 'CONFIRMED'}" method="post" th:action="@{/vendor/rentals/bookings/{id}/trip/start(id=${b.id})}" class="inline-actions"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Starting odometer (km)<input type="number" name="startOdometerKm" min="1" required></label><button class="btn primary small-btn">Start trip</button></form>
<form th:if="${b.status == 'IN_PROGRESS'}" method="post" th:action="@{/vendor/rentals/bookings/{id}/trip/complete(id=${b.id})}" class="inline-actions"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Final odometer (km)<input type="number" name="endOdometerKm" th:min="${b.startOdometerKm+1}" required></label><label th:if="${b.paymentMethod == 'CASH'}">Cash received (₹)<input type="number" name="cashReceived" min="1" step="0.01" required></label><button class="btn primary small-btn">Complete trip</button></form>
<div th:if="${b.commissionStatus == 'DUE'}" class="panel"><b th:text="${'Rental platform commission due: ₹'+#numbers.formatDecimal(b.platformCommissionAmount,1,2)}"></b><form method="post" enctype="multipart/form-data" th:action="@{/vendor/rentals/commission/{id}/submit(id=${b.id})}" class="form-grid"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>UPI UTR/reference<input name="utr" required pattern="[A-Za-z0-9]{8,30}"></label><label>Payment proof<input type="file" name="proof" required accept="image/*,.pdf"></label><button class="btn primary small-btn">Submit rental commission</button></form></div>
<p th:if="${b.commissionStatus != null}" class="muted" th:text="${'Rental commission: '+b.commissionStatus}"></p></article><section class="panel" th:if="${#lists.isEmpty(bookings)}"><h2>No rental requests yet</h2></section></main></body></html>
