<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<meta name="theme-color" content="#421064">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My rental vehicles | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css(v=56)}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap rental-wrap"><div class="page-heading"><div><div class="eyebrow">VEHICLE OWNER WORKSPACE</div><h1>My rental vehicles</h1><p class="muted">Register driver-operated vehicles and manage their verification status.</p></div><div class="actions"><a class="btn secondary" th:href="@{/vendor/rentals/bookings}">Rental bookings</a><a class="btn primary" th:href="@{/vendor/rentals/new}">＋ Register vehicle</a></div></div><div class="notice success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="notice error" th:if="${errorMessage}" th:text="${errorMessage}"></div><article class="panel rental-booking-card" th:each="v : ${vehicles}"><div class="order-head"><div><img th:if="${v.imageUrl != null}" th:src="${v.imageUrl}" th:alt="${v.makeModel}" style="width:110px;height:75px;object-fit:cover;border-radius:9px"><b th:text="${v.makeModel}"></b><small th:text="${v.registrationNumber+' · '+v.vehicleCategory+' / '+v.vehicleSubcategory}"></small></div><span class="status-pill" th:text="${v.status}"></span></div><p th:text="${v.seatingCapacity+' seats · Driver: '+v.driverName+' · '+v.driverMobile}"></p><p th:text="${'Base ₹'+#numbers.formatDecimal(v.baseFare,1,2)+' + ₹'+#numbers.formatDecimal(v.perKmRate,1,2)+'/km'}"></p><p class="muted" th:text="${v.adminNote}"></p></article><section class="panel" th:if="${#lists.isEmpty(vehicles)}"><h2>Register your first rental vehicle</h2><p>Submit vehicle, driver, insurance and fare details for admin review.</p><a class="btn primary" th:href="@{/vendor/rentals/new}">Register vehicle</a></section></main></body></html>
