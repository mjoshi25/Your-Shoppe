<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vendor orders | ASMJ Marketplace</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap"><div class="eyebrow">VENDOR CENTRE</div><h1>Customer orders</h1><div class="notice success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="notice error" th:if="${errorMessage}" th:text="${errorMessage}"></div><section class="panel" th:if="${#lists.isEmpty(orders)}"><h2>No orders received yet</h2></section><article class="panel order-card" th:each="o : ${orders}"><div class="order-head"><div><b th:text="${o.orderNumber}"></b><small th:text="${'Placed '+#temporals.format(o.createdAt,'dd MMM yyyy HH:mm')}"></small></div><span class="status-pill" th:text="${o.status}"></span></div><div class="actions"><a class="btn secondary small-btn" th:href="@{/orders/{id}/track(id=${o.id})}">Order timeline</a><a class="btn secondary small-btn" th:href="@{/orders/{id}/invoice(id=${o.id})}" target="_blank">Invoice</a></div><p>Customer: <b th:text="${o.customerName}"></b> · <span th:text="${o.customerMobile}"></span></p><p th:if="${o.fulfilmentMethod == 'DELIVERY'}" th:text="${o.deliveryAddress+', '+o.deliveryCity+', '+o.deliveryState+' - '+o.deliveryPinCode}"></p><p th:if="${o.fulfilmentMethod == 'PICKUP'}">Customer will collect from your shop.</p><ul><li th:each="i : ${o.items}" th:text="${i.productName+' × '+i.quantity}"></li></ul><p>Total: <b th:text="${'₹'+#numbers.formatDecimal(o.total,1,2)}"></b> · Payment: <b th:text="${o.paymentMethod+' / '+o.paymentStatus}"></b></p><p th:if="${o.customerNote != null and !#strings.isEmpty(o.customerNote)}" class="muted" th:text="${'Note: '+o.customerNote}"></p><form class="inline-form" method="post" th:action="@{/vendor/orders/{id}/status(id=${o.id})}" th:if="${o.status.name() != 'CANCELLED' and o.status.name() != 'COMPLETED'}"><select name="status"><option th:if="${o.status.name() == 'PLACED'}" value="ACCEPTED">Accept order</option><option th:if="${o.status.name() == 'ACCEPTED'}" value="PROCESSING">Processing</option><option th:if="${o.status.name() == 'PROCESSING' and o.fulfilmentMethod == 'PICKUP'}" value="READY_FOR_PICKUP">Ready for pickup</option><option th:if="${o.status.name() == 'PROCESSING' and o.fulfilmentMethod == 'DELIVERY'}" value="OUT_FOR_DELIVERY">Out for delivery</option><option th:if="${o.status.name() == 'READY_FOR_PICKUP' or o.status.name() == 'OUT_FOR_DELIVERY'}" value="COMPLETED">Completed</option><option th:if="${o.status.name() == 'PLACED' or o.status.name() == 'ACCEPTED' or o.status.name() == 'PROCESSING'}" value="CANCELLED">Cancel</option></select><button class="btn primary small-btn">Update status</button></form><div class="notice" th:if="${o.paymentMethod.name() == 'UPI'}"><b>Buyer UPI evidence:</b> <span th:text="${o.upiReference}"></span><a th:if="${o.paymentProofUrl != null}" th:href="${o.paymentProofUrl}" target="_blank" rel="noopener">View payment screenshot</a><span th:if="${o.paymentProofUrl == null}">No screenshot attached</span></div><div class="notice" th:if="${o.cashReceiptUrl != null}"><b>Cash receipt:</b> <a th:href="${o.cashReceiptUrl}" target="_blank" rel="noopener" th:text="${o.cashReceiptFileName}">View receipt</a></div><form th:if="${o.paymentMethod.name() == 'COD' and o.status.name() == 'COMPLETED' and o.cashReceiptUrl == null}" method="post" enctype="multipart/form-data" class="form-panel" th:action="@{/vendor/orders/{id}/cash-receipt(id=${o.id})}"><h3>Upload cash receipt</h3><label>Receipt image / PDF<input type="file" name="receipt" accept="image/jpeg,image/png,image/webp,application/pdf" required></label><label>Receipt note (optional)<input name="note" maxlength="250" placeholder="Cash received from customer"></label><button class="btn primary small-btn" type="submit">Submit cash receipt</button></form></article></main></body></html>
