<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" type="image/x-icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/favicon-192.png"><meta name="theme-color" content="#541477"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Product reviews | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap"><div class="eyebrow">VENDOR CENTRE</div><h1>Product reviews</h1><div class="notice success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="notice error" th:if="${errorMessage}" th:text="${errorMessage}"></div><article class="panel review-card" th:each="review : ${reviews}"><div class="order-head"><div><b th:text="${review.productName}"></b><small th:text="${review.customerName+' · '+review.orderNumber}"></small></div><span class="status-pill" th:text="${review.status}"></span></div><p class="rating-stars" th:text="${review.rating+' / 5 stars'}"></p><h3 th:text="${review.title}"></h3><p th:text="${review.comment}"></p><a th:if="${review.imageUrl != null}" th:href="${review.imageUrl}" target="_blank">View customer photo</a><div class="notice" th:if="${review.status.name() == 'PENDING'}">This review is awaiting admin moderation.</div><div th:if="${review.status.name() == 'APPROVED'}"><p th:if="${review.vendorReply != null}" class="muted" th:text="${'Your reply: '+review.vendorReply}"></p><form method="post" class="form-panel" th:action="@{/vendor/reviews/{id}/reply(id=${review.id})}"><label>Reply to customer<textarea name="reply" rows="3" maxlength="1000" required th:text="${review.vendorReply}"></textarea></label><button class="btn primary small-btn" type="submit">Publish reply</button></form></div></article><div class="panel" th:if="${#lists.isEmpty(reviews)}"><h2>No reviews yet</h2><p>Customer reviews will appear here after moderation.</p></div></main></body></html>
