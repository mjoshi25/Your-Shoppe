<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" type="image/x-icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/favicon-192.png"><meta name="theme-color" content="#541477"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${product.name+' | ASMJ Shoppe'}">Product details</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap"><div class="product-detail-grid"><div class="product-detail-image"><img th:src="${product.imageUrl}" th:alt="${product.name}"></div><section class="panel product-detail-info"><div class="eyebrow" th:text="${product.categoryName+' / '+product.subcategoryName}"></div><h1 th:text="${product.name}"></h1><p class="muted" th:text="${product.description}"></p><div class="product-meta"><strong th:text="${'₹'+#numbers.formatDecimal(product.price,1,2)}"></strong><small th:text="${'Sold by '+product.vendorName}"></small></div><p><b th:text="${#numbers.formatDecimal(averageRating,1,1)+' / 5'}"></b> <span class="rating-stars">★★★★★</span> <span class="muted" th:text="${'('+reviewCount+' reviews)'}"></span></p><div class="fulfilment-tags"><span th:if="${product.homeDelivery}">Home delivery</span><span th:if="${product.pickupFromShop}">Pickup from shop</span></div><div sec:authorize="hasRole('CUSTOMER')" class="actions"><form method="post" th:action="@{/customer/wishlist/{id}/add(id=${product.id})}"><button class="btn secondary" type="submit">♡ Save to wishlist</button></form><form th:if="${product.stockQuantity == null or product.stockQuantity <= 0}" method="post" th:action="@{/customer/products/{id}/stock-alert(id=${product.id})}"><button class="btn secondary" type="submit">Notify me when available</button></form></div><form sec:authorize="hasRole('CUSTOMER')" method="post" th:action="@{/cart/add/{id}(id=${product.id})}" class="inline-form"><input type="number" name="quantity" value="1" min="1" max="50"><button class="btn primary" type="submit">Add to cart</button></form><p sec:authorize="isAnonymous()"><a th:href="@{/login}">Sign in</a> to purchase this product.</p><form sec:authorize="isAnonymous() or hasRole('CUSTOMER')" class="product-enquiry-form" method="post" enctype="multipart/form-data" th:action="@{/chat/product/{id}(id=${product.id})}"><h3>Ask the vendor</h3><div sec:authorize="isAnonymous()"><input name="buyerName" required minlength="2" maxlength="80" placeholder="Your name"><input name="buyerMobile" required pattern="[+0-9() -]{8,20}" placeholder="Mobile number"></div><textarea name="message" maxlength="2000" rows="3" placeholder="Ask about availability, size, delivery or other details..."></textarea><label class="muted">Attachment (optional, max 8 MB)<input type="file" name="attachment" accept="image/jpeg,image/png,image/webp,application/pdf,text/plain,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"></label><button class="btn secondary" type="submit">Chat with Vendor</button></form><a class="btn secondary" th:href="@{/products}">Back to products</a></section></div><section class="panel"><h2>Customer reviews</h2><p class="muted" th:if="${reviewCount == 0}">No approved reviews yet.</p><article class="review-card" th:each="review : ${reviews}"><div class="order-head"><b th:text="${review.customerName}"></b><small th:text="${#temporals.format(review.createdAt,'dd MMM yyyy')}"></small></div><p class="rating-stars" th:text="${'★'.repeat(review.rating)}"></p><h3 th:text="${review.title}"></h3><p th:text="${review.comment}"></p><img class="review-photo" th:if="${review.imageUrl != null}" th:src="${review.imageUrl}" alt="Customer review photo"><div class="vendor-review-reply" th:if="${review.vendorReply != null}"><b>Vendor response</b><p th:text="${review.vendorReply}"></p></div></article></section></main></body></html>
