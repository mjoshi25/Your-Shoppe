<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<meta name="theme-color" content="#421064">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Employer workspace | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css(v=56)}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="jobs-page"><div class="alert alert-success" th:if="${success != null}" th:text="${success}"></div><div class="alert alert-error" th:if="${error != null}" th:text="${error}"></div><h1>Employer workspace</h1><p>Manage vacancies and candidate applications.</p><div class="status-line">Employer verification: <strong th:text="${profile == null ? 'NOT REGISTERED' : profile.status}">PENDING</strong></div><div class="job-actions"><a class="btn" th:href="@{/employer/register}">Employer profile</a><a class="btn" th:if="${profile != null and profile.status == 'APPROVED'}" th:href="@{/employer/jobs/new}">Post a vacancy</a></div><h2>My job openings</h2><div class="job-card" th:each="job : ${jobs}"><div><strong th:text="${job.title}">Job</strong><p th:text="${job.city + ' · ' + job.status}">Status</p></div><a class="btn btn-small" th:href="@{/employer/jobs/{id}/applications(id=${job.id})}">View applications</a></div><p th:if="${#lists.isEmpty(jobs)}">No vacancies posted yet.</p></main></body></html>
