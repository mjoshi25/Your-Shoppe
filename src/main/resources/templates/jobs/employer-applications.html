<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<meta name="theme-color" content="#421064">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Candidate applications | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css(v=56)}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="jobs-page"><div class="alert alert-success" th:if="${success != null}" th:text="${success}"></div><div class="alert alert-error" th:if="${error != null}" th:text="${error}"></div><h1 th:text="${'Applications · ' + job.title}">Applications</h1><article class="job-panel" th:each="app : ${applications}"><h2 th:text="${app.candidateName}">Candidate</h2><p th:text="${app.candidateEmail + ' · ' + app.candidateMobile}">Contact</p><p>Status: <strong th:text="${app.status}">APPLIED</strong></p><a th:href="${app.resumeUrl}" target="_blank" rel="noopener">Open resume</a><p class="preline" th:text="${app.coverLetter}"></p><form method="post" th:action="@{/employer/applications/{id}/status(id=${app.id})}" class="inline-form"><select name="status"><option>UNDER_REVIEW</option><option>SHORTLISTED</option><option>REJECTED</option><option>SELECTED</option><option>OFFERED</option><option>OFFER_ACCEPTED</option></select><input name="notes" placeholder="Internal note"><button class="btn btn-small">Update status</button></form><form method="post" enctype="multipart/form-data" th:action="@{/employer/applications/{id}/offer-letter(id=${app.id})}" class="inline-form"><label>Offer letter (PDF/DOC/DOCX, max 8 MB)<input type="file" name="offerLetter" accept=".pdf,.doc,.docx" required></label><button class="btn btn-small" type="submit">Upload offer letter</button></form><p th:if="${app.offerLetterUrl != null and !#strings.isEmpty(app.offerLetterUrl)}"><a th:href="${app.offerLetterUrl}" target="_blank" rel="noopener">View uploaded offer letter</a></p><h3>Schedule interview round</h3><form method="post" th:action="@{/employer/applications/{id}/interview(id=${app.id})}" class="job-form"><label>Round<input name="roundName" placeholder="Technical round" required></label><label>Date &amp; time<input type="datetime-local" name="scheduledAt" required></label><label>Mode<select name="mode"><option>ONLINE</option><option>OFFLINE</option><option>PHONE</option></select></label><label>Interviewer<input name="interviewer"></label><label class="full">Meeting link / location<input name="meetingLink" placeholder="Meeting URL or location"></label><button class="btn">Schedule interview</button></form><div th:each="round,iter : ${app.interviews}" class="interview-round"><strong th:text="${round.roundName + ' · ' + round.scheduledAt}">Interview</strong><p th:text="${round.mode + ' · ' + round.interviewer + ' · ' + round.meetingLink}"></p><p th:text="${'Result: ' + round.result + ' · ' + round.feedback}"></p><form method="post" th:action="@{/employer/applications/{id}/interview-feedback(id=${app.id})}" class="inline-form"><input type="hidden" name="roundIndex" th:value="${iter.index}"><input name="feedback" placeholder="Interview feedback"><select name="result"><option>PENDING</option><option>PASSED</option><option>FAILED</option></select><button class="btn btn-small">Save feedback</button></form></div></article><p th:if="${#lists.isEmpty(applications)}">No applications received yet.</p></main></body></html>
