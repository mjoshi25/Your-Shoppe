<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<meta name="theme-color" content="#421064">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My job applications | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css(v=57)}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="jobs-page"><h1>My job applications</h1><div class="job-card" th:each="app : ${applications}"><div><strong th:text="${jobs[app.jobId] != null ? jobs[app.jobId].title : 'Job opening'}">Job</strong><p>Status: <b th:text="${app.status}">APPLIED</b></p><p th:if="${!#lists.isEmpty(app.interviews)}" th:text="${'Next interview: ' + app.interviews[app.interviews.size()-1].roundName + ' · ' + app.interviews[app.interviews.size()-1].scheduledAt}"></p><a th:href="${app.resumeUrl}" target="_blank" rel="noopener">View submitted resume</a><p th:if="${app.offerLetterUrl != null and !#strings.isEmpty(app.offerLetterUrl)}"><a th:href="${app.offerLetterUrl}" target="_blank" rel="noopener">View offer letter</a></p></div></div><p th:if="${#lists.isEmpty(applications)}">You have not applied for any jobs yet. <a th:href="@{/jobs}">Browse jobs</a>.</p></main></body></html>
