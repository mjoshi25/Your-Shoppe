<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My job applications | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="jobs-page"><h1>My job applications</h1><div class="job-card" th:each="app : ${applications}"><div><strong th:text="${jobs[app.jobId] != null ? jobs[app.jobId].title : 'Job opening'}">Job</strong><p>Status: <b th:text="${app.status}">APPLIED</b></p><p th:if="${!#lists.isEmpty(app.interviews)}" th:text="${'Next interview: ' + app.interviews[app.interviews.size()-1].roundName + ' · ' + app.interviews[app.interviews.size()-1].scheduledAt}"></p><a th:href="${app.resumeUrl}" target="_blank" rel="noopener">View submitted resume</a><p th:if="${app.offerLetterUrl != null and !#strings.isEmpty(app.offerLetterUrl)}"><a th:href="${app.offerLetterUrl}" target="_blank" rel="noopener">View offer letter</a></p></div></div><p th:if="${#lists.isEmpty(applications)}">You have not applied for any jobs yet. <a th:href="@{/jobs}">Browse jobs</a>.</p></main></body></html>
