<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Employer registration | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="jobs-page"><div class="alert alert-success" th:if="${success != null}" th:text="${success}"></div><div class="alert alert-error" th:if="${error != null}" th:text="${error}"></div><div class="job-panel"><h1>Employer registration</h1><p>Register your company or recruitment consultancy. Admin verification is required before publishing vacancies.</p><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="alert alert-error" th:if="${error}" th:text="${error}"></div><div class="status-line">Current status: <strong th:text="${profile.status}">PENDING</strong><span th:if="${profile.adminNote != null}" th:text="${profile.adminNote}"></span></div><form method="post" th:action="@{/employer/register}" class="job-form"><label>Organisation / consultancy name<input name="organisationName" required maxlength="160" th:value="${profile.organisationName}"></label><label>Organisation type<select name="organisationType"><option value="COMPANY">Company / Business</option><option value="RECRUITMENT_CONSULTANCY">Recruitment consultancy</option><option value="STARTUP">Startup</option><option value="OTHER">Other</option></select></label><label>Website<input type="url" name="website" maxlength="250" th:value="${profile.website}"></label><label>City<input name="city" required maxlength="80" th:value="${profile.city}"></label><label>State<input name="state" required maxlength="80" th:value="${profile.state}"></label><label>PIN code<input name="pinCode" maxlength="10" th:value="${profile.pinCode}"></label><label class="full">Office address<input name="address" maxlength="250" th:value="${profile.address}"></label><label class="full">Organisation description<textarea name="description" rows="4" maxlength="2000" th:text="${profile.description}"></textarea></label><button class="btn" type="submit">Submit for verification</button></form></div></main></body></html>
