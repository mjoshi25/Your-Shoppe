<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Job administration | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="jobs-page"><div class="alert alert-success" th:if="${success != null}" th:text="${success}"></div><div class="alert alert-error" th:if="${error != null}" th:text="${error}"></div><h1>Jobs &amp; employer administration</h1><h2>Employer verification</h2><article class="job-card" th:each="e : ${employers}"><div><strong th:text="${e.organisationName}">Employer</strong><p th:text="${e.ownerName + ' · ' + e.email + ' · ' + e.city + ', ' + e.state}"></p><p th:text="${e.organisationType + ' · ' + e.status}"></p><p th:text="${e.description}"></p><p th:if="${e.adminNote != null}" th:text="${e.adminNote}"></p></div><form method="post" th:action="@{/admin/jobs/employers/{id}/status(id=${e.id})}" class="inline-form"><input name="note" placeholder="Admin note"><select name="status"><option>APPROVED</option><option>REJECTED</option><option>SUSPENDED</option></select><button class="btn btn-small">Update</button></form></article><h2>Job moderation</h2><article class="job-card" th:each="j : ${jobs}"><div><strong th:text="${j.title}">Job</strong><p th:text="${j.organisationName + ' · ' + j.city + ' · ' + j.status}"></p><p th:text="${j.description}"></p></div><form method="post" th:action="@{/admin/jobs/{id}/status(id=${j.id})}" class="inline-form"><input name="note" placeholder="Admin note"><select name="status"><option>PUBLISHED</option><option>REJECTED</option><option>CLOSED</option></select><button class="btn btn-small">Update</button></form></article></main></body></html>
