<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<meta name="theme-color" content="#421064">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${job.title + ' | ASMJ Shoppe'}">Job details</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="jobs-page"><a th:href="@{/jobs}">← All jobs</a><article class="job-detail"><span class="eyebrow">JOB OPENING</span><h1 th:text="${job.title}">Job title</h1><h3 th:text="${job.organisationName}">Organisation</h3><p th:text="${job.city + ', ' + job.state + ' · ' + job.employmentType + ' · ' + job.workMode}">Location</p><div class="job-facts"><span th:text="${job.experience}">Experience</span><span th:text="${job.department}">Department</span><span th:text="${job.salaryMin != null ? '₹' + job.salaryMin : 'Salary not disclosed'}">Salary</span></div><h2>About the role</h2><p class="preline" th:text="${job.description}"></p><h2>Responsibilities</h2><p class="preline" th:text="${job.responsibilities}"></p><h2>Qualifications</h2><p class="preline" th:text="${job.qualifications}"></p><h2>Skills</h2><p th:text="${job.skills}"></p><div class="job-apply"><h2>Apply for this position</h2><p>Sign in with your customer account to submit an application. Resume formats: PDF, DOC or DOCX (maximum 8 MB).</p><form method="post" enctype="multipart/form-data" th:action="@{/jobs/{id}/apply(id=${job.id})}"><label>Upload resume <input type="file" name="resume" accept=".pdf,.doc,.docx" required></label><label>Cover letter / note <textarea name="coverLetter" rows="4" maxlength="3000"></textarea></label><button class="btn" type="submit">Submit application</button></form><p sec:authorize="isAnonymous()"><a th:href="@{/login}">Sign in</a> to apply.</p></div></article></main></body></html>
