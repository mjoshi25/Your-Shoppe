<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<meta name="theme-color" content="#421064">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Post a job | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="jobs-page"><div class="alert alert-success" th:if="${success != null}" th:text="${success}"></div><div class="alert alert-error" th:if="${error != null}" th:text="${error}"></div><div class="job-panel"><h1>Post a job opening</h1><p th:if="${!isAdmin}">All vacancies are reviewed by ASMJ Shoppe before appearing publicly.</p><p th:if="${isAdmin}">Administrator publishing: save and publish directly without submitting for approval.</p><form method="post" th:action="@{/employer/jobs}" class="job-form"><label>Job title<input name="title" required maxlength="150"></label><label>Department<input name="department" maxlength="100"></label><label>Employment type<select name="employmentType" data-master-group="JOB_EMPLOYMENT_TYPE" data-placeholder="Choose employment type" required><option value="">Loading options…</option></select></label><label>Work mode<select name="workMode"><option>ONSITE</option><option>HYBRID</option><option>REMOTE</option></select></label><label>Experience required<input name="experience" placeholder="e.g. 2–4 years"></label><label>Skills<input name="skills" maxlength="500" placeholder="Java, SQL, customer support"></label><label>State<select id="jobState" name="state" data-master-group="INDIA_STATE" data-placeholder="Select state" required><option value="">Loading states…</option></select></label><label>City<select id="jobCity" name="city" data-master-group="INDIA_CITY" data-parent-select="#jobState" data-placeholder="Select state first" required><option value="">Select state first</option></select></label><label>Minimum annual salary (INR)<input type="number" name="salaryMin" min="0" step="1000"></label><label>Maximum annual salary (INR)<input type="number" name="salaryMax" min="0" step="1000"></label><label class="full">Job description<textarea name="description" required rows="5" maxlength="5000"></textarea></label><label class="full">Responsibilities<textarea name="responsibilities" rows="4" maxlength="3000"></textarea></label><label>Required qualification<select name="qualifications" data-master-group="JOB_QUALIFICATION" data-placeholder="Choose required qualification" required><option value="">Loading options…</option></select></label><button class="btn" type="submit" th:text="${isAdmin ? 'Save / Publish' : 'Submit job for approval'}">Submit job for approval</button></form></div></main><script th:src="@{/js/master-data-dropdowns.js}"></script></body></html>
