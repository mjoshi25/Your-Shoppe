<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<meta name="theme-color" content="#421064">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Post a job | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="jobs-page"><div class="alert alert-success" th:if="${success != null}" th:text="${success}"></div><div class="alert alert-error" th:if="${error != null}" th:text="${error}"></div><div class="job-panel"><h1>Post a job opening</h1><p>All vacancies are reviewed by ASMJ Shoppe before appearing publicly.</p><form method="post" th:action="@{/employer/jobs}" class="job-form"><label>Job title<input name="title" required maxlength="150"></label><label>Department<input name="department" maxlength="100"></label><label>Employment type<select name="employmentType"><option>FULL_TIME</option><option>PART_TIME</option><option>CONTRACT</option><option>INTERNSHIP</option><option>FREELANCE</option></select></label><label>Work mode<select name="workMode"><option>ONSITE</option><option>HYBRID</option><option>REMOTE</option></select></label><label>Experience required<input name="experience" placeholder="e.g. 2–4 years"></label><label>Skills<input name="skills" maxlength="500" placeholder="Java, SQL, customer support"></label><label>City<input name="city" required maxlength="80"></label><label>State<input name="state" maxlength="80"></label><label>Minimum annual salary (INR)<input type="number" name="salaryMin" min="0" step="1000"></label><label>Maximum annual salary (INR)<input type="number" name="salaryMax" min="0" step="1000"></label><label class="full">Job description<textarea name="description" required rows="5" maxlength="5000"></textarea></label><label class="full">Responsibilities<textarea name="responsibilities" rows="4" maxlength="3000"></textarea></label><label class="full">Qualifications<textarea name="qualifications" rows="4" maxlength="2000"></textarea></label><button class="btn" type="submit">Submit job for approval</button></form></div></main></body></html>
