<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Approval centre | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap" id="main-content"><div class="eyebrow">ADMIN · MODERATION</div><h1>Approval centre</h1><p class="muted">Manage clarification requests, supporting documents and review decisions.</p><div th:if="${successMessage}" class="notice" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="notice error" th:text="${errorMessage}"></div><p><a class="btn primary" th:href="@{/admin/approval-center/new}">＋ Create information request</a></p><section class="panel"><div class="table-wrap"><table><thead><tr><th>Item</th><th>Module</th><th>Submitter</th><th>Status</th><th>Last updated</th><th></th></tr></thead><tbody><tr th:each="c : ${cases}"><td><strong th:text="${c.subjectTitle}">Item</strong><small th:text="${c.subjectType+' / '+c.subjectId}"></small></td><td th:text="${c.module}"></td><td th:text="${c.ownerEmail}"></td><td><span class="status-pill" th:text="${c.status}"></span></td><td th:text="${c.updatedAt}"></td><td><a th:href="@{/admin/approval-center/{id}(id=${c.id})}">Review →</a></td></tr><tr th:if="${#lists.isEmpty(cases)}"><td colspan="6">No approval support cases yet. Create a request for a pending item.</td></tr></tbody></table></div></section></main></body></html>
