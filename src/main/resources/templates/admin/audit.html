<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" type="image/x-icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/favicon-192.png"><meta name="theme-color" content="#541477"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit log | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap" id="main-content" tabindex="-1"><div class="eyebrow">ADMIN · SECURITY</div><h1>Audit activity</h1><p class="muted">Latest 300 recorded security-sensitive marketplace actions.</p><section class="panel"><div class="table-wrap"><table><thead><tr><th>Time</th><th>Actor</th><th>Role</th><th>Action</th><th>Record</th><th>Details</th></tr></thead><tbody><tr th:each="e : ${events}"><td th:text="${e.createdAt}"></td><td th:text="${e.actor}"></td><td th:text="${e.role}"></td><td th:text="${e.action}"></td><td th:text="${e.entityType+' / '+e.entityId}"></td><td th:text="${e.details}"></td></tr><tr th:if="${#lists.isEmpty(events)}"><td colspan="6">No audit events recorded yet.</td></tr></tbody></table></div></section></main></body></html>
