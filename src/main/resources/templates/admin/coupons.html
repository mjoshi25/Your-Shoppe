<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Coupons</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap"><div class="eyebrow">ADMIN</div><h1>Discount coupons</h1><div class="notice success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="notice error" th:if="${errorMessage}" th:text="${errorMessage}"></div><section class="panel"><h2>Create coupon</h2><form method="post" th:action="@{/admin/coupons}" class="form-grid"><label>Code<input name="code" maxlength="24" pattern="[A-Za-z0-9_-]{3,24}" required></label><label>Description<input name="description" maxlength="160"></label><label>Discount type<select name="discountType"><option value="PERCENT">Percentage</option><option value="FIXED">Fixed amount (INR)</option></select></label><label>Value<input name="value" type="number" min="0.01" step="0.01" required></label><label>Minimum order (INR)<input name="minimumOrder" type="number" min="0" step="0.01" value="0"></label><label>Maximum discount (INR, optional)<input name="maximumDiscount" type="number" min="0.01" step="0.01"></label><label>Total usage limit (optional)<input name="usageLimit" type="number" min="1"></label><button class="btn primary" type="submit">Create coupon</button></form></section><section class="panel"><h2>Existing coupons</h2><p class="muted" th:if="${#lists.isEmpty(coupons)}">No coupons created yet.</p><article class="summary-line" th:each="c : ${coupons}"><div><b th:text="${c.code}"></b><small th:text="${c.description+' · '+c.discountType+' '+c.value+' · used '+c.usageCount}"></small></div><form method="post" th:action="@{/admin/coupons/{id}/toggle(id=${c.id})}"><button class="btn secondary small-btn" type="submit" th:text="${c.active?'Deactivate':'Activate'}"></button></form></article></section></main></body></html>
