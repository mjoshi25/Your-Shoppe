<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Order complaints | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css(v=58)}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap" id="main-content"><h1>Order complaints</h1><p class="muted">Review customer complaints and record the resolution. Verify facts and payment responsibility before deciding refunds.</p><section class="panel" th:each="c : ${complaints}"><h2 th:text="${c.subject+' · '+c.orderNumber}">Complaint</h2><p><b>Customer:</b> <span th:text="${c.customerName}"></span></p><p th:text="${c.description}"></p><p><b>Status:</b> <span th:text="${c.status}"></span></p><form method="post" th:action="@{/admin/complaints/{id}/update(id=${c.id})}" class="form-grid"><label>Status<select name="status"><option th:each="s : ${T(com.asmj.marketplace.complaints.OrderComplaint$Status).values()}" th:value="${s}" th:selected="${s == c.status}" th:text="${s}"></option></select></label><label>Admin note<textarea name="adminNote" maxlength="2000" th:text="${c.adminNote}"></textarea></label><button class="btn primary" type="submit">Save update</button></form></section><p th:if="${#lists.isEmpty(complaints)}">No complaints received.</p></main></body></html>
