<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New approval request | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css(v=56)}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap" id="main-content"><div class="eyebrow">ADMIN · APPROVAL CENTRE</div><h1>Create information request</h1><p class="muted">Link the request to the existing pending item using its record type and ID.</p><div th:if="${errorMessage}" class="notice error" th:text="${errorMessage}"></div><form class="panel form-grid" method="post" th:action="@{/admin/approval-center/new}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="field">Submitter account<select name="ownerEmail" required><option value="">Choose account</option><option th:each="u : ${users}" th:if="${u.role.name() != 'ROLE_ADMIN'}" th:value="${u.email}" th:text="${u.fullName+' — '+u.email}"></option></select></label><label class="field">Module<select name="module" required><option value="VENDOR">Vendor</option><option value="PRODUCT">Product</option><option value="RENTAL">Rental</option><option value="SERVICE_PROVIDER">Service provider</option><option value="SERVICE_LISTING">Service listing</option><option value="EMPLOYER">Employer</option><option value="JOB">Job</option><option value="EVENT">Event</option><option value="CLASSIFIED">Classified</option><option value="BUSINESS">Business directory</option><option value="COURSE">Course</option><option value="WHOLESALE">Wholesale / B2B</option><option value="DELIVERY">Delivery / logistics</option><option value="FREELANCER">Freelancer</option><option value="OTHER">Other</option></select></label><label class="field">Record type<input name="subjectType" required maxlength="80" placeholder="e.g. RentalVehicle"></label><label class="field">Record ID<input name="subjectId" required maxlength="120"></label><label class="field" style="grid-column:1/-1">Item title<input name="subjectTitle" required maxlength="180" placeholder="e.g. Vehicle registration application"></label><label class="field" style="grid-column:1/-1">Details / documents required<textarea name="message" required rows="4" maxlength="3000" placeholder="Explain exactly what the submitter must provide..."></textarea></label><div><button class="btn primary" type="submit">Send request</button> <a class="btn secondary" th:href="@{/admin/approval-center}">Cancel</a></div></form></main></body></html>
