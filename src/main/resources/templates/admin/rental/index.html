<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rental administration | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap rental-wrap"><div class="eyebrow">MARKETPLACE ADMIN</div><h1>Rental vehicle approvals</h1><div class="notice success" th:if="${successMessage}" th:text="${successMessage}"></div><section class="panel"><h2>Rental commission settings</h2><p class="muted">Separate from marketplace product-order commission. Applies to trips completed after the rate is changed.</p><form method="post" th:action="@{/admin/rentals/settings}" class="inline-actions"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Commission rate (%)<input type="number" name="commissionRatePercent" min="0" max="30" step="0.01" th:value="${rentalSettings.commissionRatePercent}" required></label><button class="btn primary small-btn">Save rental commission</button></form></section><section><h2>Vehicle listings</h2><article class="panel rental-booking-card" th:each="v : ${vehicles}"><div class="order-head"><div><img th:if="${v.imageUrl != null}" th:src="${v.imageUrl}" th:alt="${v.makeModel}" style="width:110px;height:75px;object-fit:cover;border-radius:9px"><b th:text="${v.makeModel}"></b><small th:text="${v.registrationNumber+' · '+v.vehicleCategory+' · Owner '+v.ownerName}"></small></div><span class="status-pill" th:text="${v.status}"></span></div><p th:text="${v.seatingCapacity+' seats · Driver '+v.driverName+' · '+v.driverMobile}"></p><p th:text="${'Licence '+v.driverLicenceNumber+' valid until '+v.driverLicenceValidUntil+' · Insurance until '+v.insuranceValidUntil}"></p><p th:text="${'Base ₹'+#numbers.formatDecimal(v.baseFare,1,2)+' + ₹'+#numbers.formatDecimal(v.perKmRate,1,2)+'/km'}"></p><div class="inline-actions" th:if="${v.status != 'APPROVED'}"><form method="post" th:action="@{/admin/rentals/vehicles/{id}/decision(id=${v.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="decision" value="APPROVE"><button class="btn primary small-btn">Approve vehicle</button></form></div><div class="inline-actions" th:if="${v.status == 'APPROVED'}"><form method="post" th:action="@{/admin/rentals/vehicles/{id}/decision(id=${v.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="decision" value="SUSPEND"><button class="btn danger small-btn">Suspend</button></form></div><form method="post" th:if="${v.status == 'PENDING'}" th:action="@{/admin/rentals/vehicles/{id}/decision(id=${v.id})}" class="form-grid"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="decision" value="REJECT"><label>Rejection reason<input name="note" maxlength="300"></label><button class="btn danger small-btn">Reject</button></form></article></section><section><h2>Rental booking overview</h2><article class="panel rental-booking-card" th:each="b : ${bookings}"><div class="order-head"><b th:text="${b.bookingNumber}"></b><span class="status-pill" th:text="${b.status}"></span></div><p th:text="${b.vehicleName+' · '+b.pickupAddress+' → '+b.dropAddress}"></p><p th:text="${b.customerName+' · '+b.pickupDate+' '+b.pickupTime+' · Estimate ₹'+#numbers.formatDecimal(b.estimatedFare,1,2)}"></p></article></section><section><h2>Rental commission settlement</h2><article class="panel rental-booking-card" th:each="b : ${bookings}" th:if="${b.commissionStatus == 'DUE' or b.commissionStatus == 'SUBMITTED' or b.commissionStatus == 'PAID'}"><b th:text="${b.bookingNumber+' · '+b.ownerUserId}"></b><p th:text="${'Commission ₹'+#numbers.formatDecimal(b.platformCommissionAmount,1,2)+' · '+b.commissionStatus}"></p><a th:if="${b.commissionPaymentProofUrl != null}" th:href="${b.commissionPaymentProofUrl}" target="_blank" rel="noopener">View vendor payment proof</a><form th:if="${b.commissionStatus == 'SUBMITTED'}" method="post" th:action="@{/admin/rentals/commission/{id}/verify(id=${b.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn primary small-btn">Verify rental commission</button></form></article></section></main></body></html>
