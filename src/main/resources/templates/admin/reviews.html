<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" type="image/x-icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/favicon-192.png"><meta name="theme-color" content="#541477"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Review moderation | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap"><div class="eyebrow">ADMINISTRATION</div><h1>Product review moderation</h1><div class="notice success" th:if="${successMessage}" th:text="${successMessage}"></div><article class="panel review-card" th:each="review : ${reviews}"><div class="order-head"><div><b th:text="${review.productName}"></b><small th:text="${review.customerName+' · '+review.orderNumber}"></small></div><span class="status-pill" th:text="${review.status}"></span></div><p class="rating-stars" th:text="${review.rating+' / 5 stars'}"></p><h3 th:text="${review.title}"></h3><p th:text="${review.comment}"></p><a th:if="${review.imageUrl != null}" th:href="${review.imageUrl}" target="_blank">View attached photo</a><div class="actions"><form method="post" th:action="@{/admin/reviews/{id}/moderate(id=${review.id})}"><input type="hidden" name="status" value="APPROVED"><button class="btn success small-btn" type="submit">Approve</button></form><form method="post" th:action="@{/admin/reviews/{id}/moderate(id=${review.id})}"><input type="hidden" name="status" value="REJECTED"><button class="btn danger small-btn" type="submit">Reject</button></form></div></article><div class="panel" th:if="${#lists.isEmpty(reviews)}"><h2>No pending reviews</h2><p>There are no reviews waiting for moderation.</p></div></main></body></html>
