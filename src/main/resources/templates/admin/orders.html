<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" type="image/x-icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/favicon-192.png"><meta name="theme-color" content="#541477"><meta name="viewport" content="width=device-width, initial-scale=1"><title>All orders | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap"><div class="eyebrow">ADMIN</div><h1>Marketplace orders</h1><div class="notice success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="notice error" th:if="${errorMessage}" th:text="${errorMessage}"></div><section class="panel" th:if="${#lists.isEmpty(orders)}"><h2>No orders yet</h2></section><article class="panel order-card" th:each="o : ${orders}"><div class="order-head"><div><b th:text="${o.orderNumber}"></b><small th:text="${#temporals.format(o.createdAt,'dd MMM yyyy HH:mm')}"></small></div><span class="status-pill" th:text="${o.status}"></span></div><p>Customer: <b th:text="${o.customerName}"></b> · <span th:text="${o.customerMobile}"></span></p><p>Vendor: <b th:text="${o.vendorName}"></b></p><p>Total: <b th:text="${'₹'+#numbers.formatDecimal(o.total,1,2)}"></b> · <span th:text="${o.paymentMethod+' / '+o.paymentStatus}"></span></p><p th:if="${o.upiReference != null}" th:text="${'UPI reference: '+o.upiReference}"></p><p class="muted" th:if="${o.paymentMethod.name() == 'UPI' and o.paymentStatus.name() == 'PROOF_SUBMITTED'}">Awaiting verification by the vendor.</p><p class="muted" th:if="${o.paymentVerifiedBy != null}" th:text="${'Verified by vendor: '+o.paymentVerifiedBy}"></p><div class="notice" th:if="${o.upiReference != null}"><b>UPI UTR:</b> <span th:text="${o.upiReference}"></span><a th:if="${o.paymentProofUrl != null}" th:href="${o.paymentProofUrl}" target="_blank" rel="noopener">View customer screenshot</a></div><div class="notice" th:if="${o.cashReceiptUrl != null}"><b>Cash receipt:</b> <a th:href="${o.cashReceiptUrl}" target="_blank" rel="noopener" th:text="${o.cashReceiptFileName}">View receipt</a></div><section class="notice" th:if="${!#lists.isEmpty(o.paymentTransactions)}"><h3>Payment/refund accounting</h3><p>Received: <b th:text="${'₹'+#numbers.formatDecimal(o.totalPayments,1,2)}"></b> · Refunded: <b th:text="${'₹'+#numbers.formatDecimal(o.totalRefunds,1,2)}"></b> · Net: <b th:text="${'₹'+#numbers.formatDecimal(o.netReceived,1,2)}"></b></p><div class="summary-line" th:each="tx : ${o.paymentTransactions}"><span th:text="${tx.type+' · '+tx.method+' · '+(tx.category == null ? '' : tx.category+' · ')+tx.recordedAt+' · '+tx.recordedBy+' · '+(tx.reference == null ? '' : tx.reference)}"></span><b th:text="${(tx.type == 'REFUND' ? '-₹' : '₹')+#numbers.formatDecimal(tx.amount,1,2)}"></b><a th:if="${tx.proofUrl != null}" th:href="${tx.proofUrl}" target="_blank" rel="noopener">Proof</a></div></section></article></main></body></html>
