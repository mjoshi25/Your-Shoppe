<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" type="image/x-icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/favicon-192.png"><meta name="theme-color" content="#541477"><meta name="viewport" content="width=device-width, initial-scale=1"><title>All orders | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap"><div class="eyebrow">ADMIN</div><h1>Marketplace orders</h1><div class="notice success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="notice error" th:if="${errorMessage}" th:text="${errorMessage}"></div><section class="panel" th:if="${#lists.isEmpty(orders)}"><h2>No orders yet</h2></section><article class="panel order-card" th:each="o : ${orders}"><div class="order-head"><div><b th:text="${o.orderNumber}"></b><small th:text="${#temporals.format(o.createdAt,'dd MMM yyyy HH:mm')}"></small></div><span class="status-pill" th:text="${o.status}"></span></div><p>Customer: <b th:text="${o.customerName}"></b> · <span th:text="${o.customerMobile}"></span></p><p>Vendor: <b th:text="${o.vendorName}"></b></p><p>Total: <b th:text="${'₹'+#numbers.formatDecimal(o.total,1,2)}"></b> · <span th:text="${o.paymentMethod+' / '+o.paymentStatus}"></span></p><p th:if="${o.upiReference != null}" th:text="${'UPI reference: '+o.upiReference}"></p><form th:if="${o.paymentMethod.name() == 'UPI' and o.paymentStatus.name() == 'PROOF_SUBMITTED'}" class="inline-form" method="post" th:action="@{/admin/orders/{id}/payment-status(id=${o.id})}"><input name="note" maxlength="250" placeholder="Review note / rejection reason"><button class="btn primary small-btn" name="status" value="VERIFIED">Verify vendor payment</button><button class="btn secondary small-btn" name="status" value="REJECTED">Reject evidence</button></form><div class="notice" th:if="${o.upiReference != null}"><b>UPI UTR:</b> <span th:text="${o.upiReference}"></span><a th:if="${o.paymentProofUrl != null}" th:href="${o.paymentProofUrl}" target="_blank" rel="noopener">View buyer screenshot</a></div><div class="notice" th:if="${o.cashReceiptUrl != null}"><b>Cash receipt:</b> <a th:href="${o.cashReceiptUrl}" target="_blank" rel="noopener" th:text="${o.cashReceiptFileName}">View receipt</a></div></article></main></body></html>
