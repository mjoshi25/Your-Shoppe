<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Category management | ASMJ Marketplace</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap"><div class="eyebrow">MARKETPLACE ADMIN</div><h1>Categories &amp; subcategories</h1><p class="muted">Manage the product catalogue structure. Existing product references are updated on rename and protected from unsafe deletion.</p><div class="notice success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="notice error" th:if="${errorMessage}" th:text="${errorMessage}"></div><section class="panel form-panel"><h2>Create category</h2><form method="post" th:action="@{/admin/categories}" class="inline-form"><input name="name" required minlength="2" maxlength="80" placeholder="Category name"><button class="btn primary" type="submit">Add category</button></form></section><section class="category-admin-list"><article class="panel category-admin-card" th:each="c : ${categories}"><div class="category-admin-head"><div><h2 th:text="${c.name}">Category</h2><span class="status-pill" th:classappend="${c.active?'active':'rejected'}" th:text="${c.active?'ACTIVE':'INACTIVE'}"></span></div><div class="inline-actions"><form method="post" th:action="@{/admin/categories/{id}/active(id=${c.id})}"><input type="hidden" name="active" th:value="${!c.active}"><button class="btn secondary small-btn" th:text="${c.active?'Deactivate':'Activate'}"></button></form><form method="post" th:action="@{/admin/categories/{id}/delete(id=${c.id})}" onsubmit="return confirm('Delete this category? Deletion is blocked when products use it.')"><button class="btn danger small-btn" type="submit">Delete</button></form></div></div><form method="post" class="inline-form" th:action="@{/admin/categories/{id}/rename(id=${c.id})}"><input name="name" required minlength="2" maxlength="80" th:value="${c.name}"><button class="btn secondary small-btn" type="submit">Save category name</button></form><h3>Subcategories</h3><div class="subcategory-admin-row" th:each="sub : ${c.subcategories}"><div><strong th:text="${sub}">Subcategory</strong><span class="status-pill" th:classappend="${c.inactiveSubcategories.contains(sub)?'rejected':'active'}" th:text="${c.inactiveSubcategories.contains(sub)?'INACTIVE':'ACTIVE'}"></span></div><div class="inline-actions"><form method="post" th:action="@{/admin/categories/{id}/subcategories/rename(id=${c.id})}" class="inline-form"><input type="hidden" name="oldName" th:value="${sub}"><input name="name" th:value="${sub}" required minlength="2" maxlength="80"><button class="btn secondary small-btn" type="submit">Rename</button></form><form method="post" th:action="@{/admin/categories/{id}/subcategories/active(id=${c.id})}"><input type="hidden" name="name" th:value="${sub}"><input type="hidden" name="active" th:value="${c.inactiveSubcategories.contains(sub)}"><button class="btn secondary small-btn" th:text="${c.inactiveSubcategories.contains(sub)?'Activate':'Deactivate'}"></button></form><form method="post" th:action="@{/admin/categories/{id}/subcategories/delete(id=${c.id})}" onsubmit="return confirm('Delete this subcategory? Deletion is blocked when products use it.')"><input type="hidden" name="name" th:value="${sub}"><button class="btn danger small-btn" type="submit">Delete</button></form></div></div><form method="post" class="inline-form add-subcategory" th:action="@{/admin/categories/{id}/subcategories(id=${c.id})}"><input name="name" required minlength="2" maxlength="80" placeholder="New subcategory"><button class="btn primary small-btn" type="submit">Add subcategory</button></form></article><div class="panel" th:if="${#lists.isEmpty(categories)}">No categories yet. Add your first category above.</div></section></main></body></html>
