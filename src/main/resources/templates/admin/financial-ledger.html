<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financial ledger | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="jobs-page"><section class="jobs-hero"><h1>Marketplace financial ledger</h1><p>Verify actual remittances before marking entries paid or settled.</p><a href="/vendor/financial-ledger">Vendor ledger view</a></section><section class="job-panel"><div th:if="${successMessage}" th:text="${successMessage}"></div><div th:if="${errorMessage}" th:text="${errorMessage}"></div><div class="table-responsive"><table><thead><tr><th>Reference</th><th>Module / Component</th><th>Payer → Payee</th><th>Amount</th><th>Payment / settlement</th><th>UTR / proof</th><th>Action</th></tr></thead><tbody><tr th:each="e : ${entries}"><td th:text="${e.referenceNumber}"></td><td th:text="${e.moduleType+' / '+e.component}"></td><td th:text="${e.payerType+' ('+e.payerId+') → '+e.payeeType+' ('+e.payeeId+')'}"></td><td th:text="${'₹'+e.amount}"></td><td th:text="${e.paymentStatus+' / '+e.settlementStatus}"></td><td><span th:text="${e.transactionReference}"></span><br><a th:if="${e.proofUrl != null and !e.proofUrl.isBlank()}" th:href="${e.proofUrl}" target="_blank" rel="noopener">View proof</a></td><td><form th:if="${e.paymentStatus == 'SUBMITTED_FOR_VERIFICATION'}" method="post" th:action="@{'/admin/financial-ledger/'+${e.id}+'/verify'}"><button type="submit">Verify & settle</button></form><form th:if="${e.paymentStatus == 'SUBMITTED_FOR_VERIFICATION'}" method="post" th:action="@{'/admin/financial-ledger/'+${e.id}+'/reject'}"><input name="reason" placeholder="Reason for rejection" required><button type="submit">Reject</button></form></td></tr></tbody></table></div><p th:if="${#lists.isEmpty(entries)}">No financial entries have been recorded yet.</p></section></main></body></html>
