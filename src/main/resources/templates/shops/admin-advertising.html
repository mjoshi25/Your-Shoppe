<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shop advertisements | Admin</title><link rel="stylesheet" th:href="@{/css/app.css(v=79)}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap" style="max-width:1200px;margin:30px auto;padding:0 18px 50px"><h1>Shop advertisements</h1><p>Verify UPI payment and approve shop advertisements separately.</p><section class="panel" style="padding:18px;margin:18px 0"><h2>Manage shop categories</h2><form method="post" th:action="@{/admin/shop-advertising/category}" style="display:flex;gap:10px;flex-wrap:wrap"><input name="name" required maxlength="60" placeholder="New shop category"><button class="btn primary">Add category</button></form><div th:each="c : ${categories}" style="padding:8px 0"><span th:text="${c.name}"></span> · <span th:text="${c.active ? 'ACTIVE' : 'INACTIVE'}"></span><form style="display:inline" method="post" th:action="@{/admin/shop-advertising/category/{id}/toggle(id=${c.id})}"><button type="submit" class="btn">Activate / deactivate</button></form></div></section><section class="panel" style="padding:18px;margin:14px 0" th:each="a : ${ads}"><h2 th:text="${a.shopName}"></h2><p>Vendor: <span th:text="${a.vendorName}"></span> · Category: <span th:text="${a.categoryName}"></span></p><p th:text="${a.description}"></p><img th:src="${a.bannerUrl}" alt="Shop banner" style="max-width:300px;max-height:120px;object-fit:cover"><p>Amount: <b th:text="${'₹'+a.amount}"></b> · Dates: <span th:text="${a.startDate+' to '+a.endDate}"></span></p><p>UTR: <b th:text="${a.paymentUtr}"></b> · Payment: <b th:text="${a.paymentStatus}"></b> · Approval: <b th:text="${a.approvalStatus}"></b> · Status: <b th:text="${a.status}"></b></p><p th:if="${a.regulatoryLicenceNumber != null}">Pharmacy licence: <b th:text="${a.regulatoryLicenceNumber}"></b> · <a th:href="${a.regulatoryLicenceProofUrl}" target="_blank" rel="noopener">View licence document</a></p><a th:if="${a.paymentProofUrl != null}" th:href="${a.paymentProofUrl}" target="_blank" rel="noopener">View payment screenshot</a><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px"><form method="post" th:if="${a.paymentStatus == 'PENDING'}" th:action="@{/admin/shop-advertising/{id}/verify(id=${a.id})}"><button class="btn primary">Verify payment</button></form><form method="post" th:if="${a.paymentStatus == 'VERIFIED' and a.approvalStatus == 'PENDING'}" th:action="@{/admin/shop-advertising/{id}/approve(id=${a.id})}"><button class="btn primary">Approve advertisement</button></form><form method="post" th:if="${a.status == 'APPROVED'}" th:action="@{/admin/shop-advertising/{id}/suspend(id=${a.id})}"><button class="btn">Suspend</button></form><form method="post" th:if="${a.approvalStatus != 'REJECTED'}" th:action="@{/admin/shop-advertising/{id}/reject(id=${a.id})}"><input name="reason" required maxlength="500" placeholder="Rejection reason"><button class="btn">Reject</button></form></div><p>Impressions: <span th:text="${a.impressions}"></span> · Clicks: <span th:text="${a.clicks}"></span></p></section></main></body></html>
