<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Advertise your shop | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css(v=79)}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap" style="max-width:1100px;margin:30px auto;padding:0 18px 50px"><h1>Advertise your shop</h1><p>Paid shop advertisements appear in the public Shops directory only after Admin verifies payment and approves them.</p><div class="panel" style="padding:20px;margin:18px 0"><h2>Advertising package</h2><p><b th:text="${'₹'+price}"></b> for <b th:text="${durationDays+' days'}"></b></p><p th:if="${settings.upiId != null and !#strings.isEmpty(settings.upiId)}">Pay to UPI ID: <b th:text="${settings.upiId}"></b> (<span th:text="${settings.payeeName}"></span>)</p><img th:if="${settings.qrImageUrl != null and !#strings.isEmpty(settings.qrImageUrl)}" th:src="${settings.qrImageUrl}" alt="Admin UPI QR" style="max-width:180px"></div><form class="panel" style="padding:20px;display:grid;gap:12px" method="post" enctype="multipart/form-data" th:action="@{/vendor/shop-advertising/create}"><label>Shop name<input name="shopName" required maxlength="100"></label><label>Shop category<select name="categoryId" required><option value="">Choose category</option><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option></select></label><label>Shop description<textarea name="description" maxlength="500" rows="3"></textarea></label><label>Advertisement start date<input type="date" name="startDate" required th:min="${T(java.time.LocalDate).now()}"></label><label>Shop banner image<input type="file" name="banner" accept="image/*" required></label><label>Shop logo (optional)<input type="file" name="logo" accept="image/*"></label><label>Pharmacy licence number (required for Pharmaceutical Store)<input name="regulatoryLicenceNumber" maxlength="100"></label><label>Pharmacy licence document (required for Pharmaceutical Store)<input type="file" name="regulatoryLicenceProof" accept="image/*,.pdf"></label><label>UPI UTR/reference<input name="paymentUtr" required minlength="8" maxlength="30"></label><label>Payment screenshot<input type="file" name="paymentProof" accept="image/*" required></label><button class="btn primary" type="submit">Submit shop advertisement</button></form><h2 style="margin-top:28px">My shop advertisements</h2><div class="panel" style="padding:18px;margin:12px 0" th:each="a : ${ads}"><b th:text="${a.shopName}"></b> · <span th:text="${a.categoryName}"></span><p>Payment: <b th:text="${a.paymentStatus}"></b> · Approval: <b th:text="${a.approvalStatus}"></b> · Status: <b th:text="${a.status}"></b></p><p th:text="${a.startDate+' to '+a.endDate}"></p><p th:if="${a.rejectionReason != null}" th:text="${a.rejectionReason}"></p></div></main></body></html>
