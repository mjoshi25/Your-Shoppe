<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${shopAd.shopName+' | ASMJ Shoppe'}"></title><link rel="stylesheet" th:href="@{/css/app.css(v=79)}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap shop-store"><a th:href="@{/shops}">← All advertised shops</a><section class="store-hero"><img th:src="${shopAd.bannerUrl}" th:alt="${shopAd.shopName}"><div><span th:text="${shopAd.categoryName}"></span><h1 th:text="${shopAd.shopName}"></h1><p th:text="${shopAd.description}"></p><p th:if="${profile != null}" th:text="${profile.city+', '+profile.state}"></p></div></section><h2>Available products</h2><div class="product-grid"><article class="product-card" th:each="p : ${products}"><a th:href="@{/products/{id}(id=${p.id})}"><img th:src="${p.imageUrl}" th:alt="${p.name}"><h3 th:text="${p.name}"></h3></a><p th:text="${p.description}"></p><strong th:text="${'₹'+p.price}"></strong><a class="btn primary" th:href="@{/products/{id}(id=${p.id})}">View product</a></article></div><p th:if="${#lists.isEmpty(products)}">This shop has no currently available products.</p></main><style>.shop-store{max-width:1180px;margin:30px auto;padding:0 18px 50px}.store-hero{margin:18px 0 28px;border-radius:20px;overflow:hidden;background:#f7effa}.store-hero>img{width:100%;height:300px;object-fit:cover}.store-hero>div{padding:22px}.store-hero h1{margin:6px 0;color:#351047}.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.product-card{border:1px solid #e8d9ef;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}.product-card img{width:100%;height:170px;object-fit:contain}.product-card a{color:inherit;text-decoration:none}.product-card .btn{margin-top:auto}</style></body></html>
