<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<meta name="theme-color" content="#421064">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Services & Appointments | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css(v=56)}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="page-shell services-page"><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="alert alert-error" th:if="${error}" th:text="${error}"></div><div class="page-heading"><div><p class="eyebrow">ASMJ SERVICES</p><h1>Find trusted local professionals</h1><p>Book home services, healthcare appointments, beauty, learning and more.</p></div><a class="btn btn-primary" th:href="@{/service-provider/register}">Become a service provider</a></div><form class="service-filter" method="get" th:action="@{/services}"><input name="q" th:value="${q}" placeholder="Search electrician, doctor, salon…"><select name="category"><option value="">All categories</option><option th:each="c:${categories}" th:value="${c.id}" th:selected="${selectedCategory == c.id}" th:text="${c.name}"></option></select><input name="pin" th:value="${pin}" placeholder="Service PIN code" maxlength="6"><button class="btn btn-primary">Search services</button></form><div class="service-grid"><article class="service-card" th:each="s:${services}"><div class="service-card-icon">✦</div><p class="eyebrow" th:text="${s.categoryName}">Category</p><h2 th:text="${s.title}">Service title</h2><p th:text="${s.description}">Description</p><div class="service-card-meta"><span th:text="${s.providerName}">Provider</span><strong th:if="${s.price != null and s.price.signum() > 0}" th:text="${'₹' + s.price}">₹0</strong><strong th:unless="${s.price != null and s.price.signum() > 0}">Quotation</strong></div><a class="btn btn-primary" th:href="@{/services/{id}(id=${s.id})}">View service</a></article><p class="empty-state" th:if="${#lists.isEmpty(services)}">No approved services found. Try another category or PIN code.</p></div></main></body></html>
