<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Request an appointment | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="page-shell"><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="alert alert-error" th:if="${error}" th:text="${error}"></div><div class="form-card service-form-card"><p class="eyebrow">APPOINTMENT REQUEST</p><h1 th:text="${service.title}">Service</h1><p th:text="${'Provider: ' + service.providerName}"></p><p class="muted">Choose a preferred date and time. The provider must accept the request before it is confirmed.</p><form method="post" th:action="@{/services/{id}/book(id=${service.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Preferred date and time<input type="datetime-local" name="appointmentDateTime" required></label><label>Service PIN code<input name="pinCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" th:required="${service.serviceMode != 'ONLINE'}"></label><label>Service address<textarea name="serviceAddress" rows="2" maxlength="300" th:required="${service.serviceMode != 'ONLINE'}" placeholder="House, street, landmark"></textarea></label><label>Describe your requirement<textarea name="customerNotes" rows="4" maxlength="1500" placeholder="Share relevant details (do not include sensitive medical information)"></textarea></label><button class="btn btn-primary" type="submit">Send booking request</button></form></div></main></body></html>
