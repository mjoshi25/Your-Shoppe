<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Add service | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap"><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="alert alert-error" th:if="${error}" th:text="${error}"></div><div class="form-card wide-form"><p class="eyebrow">NEW SERVICE LISTING</p><h1>Describe your service</h1><p>Every listing requires admin approval before it becomes bookable.</p><form method="post" th:action="@{/provider/services}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Service title<input name="title" required maxlength="120" placeholder="e.g. Home electrical repair"></label><label>Category<select name="categoryId" required><option value="">Select category</option><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}"></option></select></label><label>Description<textarea name="description" rows="5" required maxlength="2500"></textarea></label><div class="form-grid"><label>Pricing model<select name="pricingType"><option value="FIXED">Fixed price</option><option value="STARTING_AT">Starting price</option><option value="HOURLY">Per hour</option><option value="VISIT">Per visit</option><option value="SESSION">Per session</option><option value="QUOTE">Quotation required</option></select></label><label>Price / starting price (₹)<input type="number" name="price" min="0" step="0.01" value="0"></label><label>Duration (minutes)<input type="number" name="durationMinutes" min="15" max="1440" value="60" required></label><label>Service mode<select name="serviceMode"><option value="AT_CUSTOMER">At customer location</option><option value="AT_PROVIDER">At provider location</option><option value="ONLINE">Online appointment</option><option value="BOTH">Both</option></select></label><label>Available days (MONDAY,TUESDAY,... or MON-FRI)<input name="availableDays" required placeholder="MONDAY,TUESDAY,WEDNESDAY"></label><label>Daily start time<input type="time" name="startTime" required value="09:00"></label><label>Daily end time<input type="time" name="endTime" required value="18:00"></label><label>Slot interval (minutes)<input type="number" name="slotIntervalMinutes" min="15" max="480" value="60"></label></div><label>Serviceable PIN codes (comma separated)<input name="servicePinCodes" maxlength="1000" placeholder="766001, 766002"></label><button class="btn btn-primary">Submit for admin approval</button></form></div></main></body></html>
