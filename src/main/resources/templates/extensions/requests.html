<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<meta name="theme-color" content="#421064">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My requests | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css(v=56)}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="jobs-page"><h1>My requests</h1><div class="community-grid"><article class="community-card" th:each="r : ${requests}"><div><span class="status-line" th:text="${r.status}">SUBMITTED</span><h2 th:text="${r.type}">Type</h2><p th:if="${r.ticketReference != null}"><strong th:text="${'Ticket reference: ' + r.ticketReference}"></strong></p><p th:text="${r.message}">Message</p><p th:if="${r.quantity != null}" th:text="${'Quantity: ' + r.quantity}"></p><p th:if="${r.pickupAddress != null}" th:text="${'Pickup: ' + r.pickupAddress}"></p><p th:if="${r.dropAddress != null}" th:text="${'Drop: ' + r.dropAddress}"></p></div></article></div><div class="empty-state" th:if="${#lists.isEmpty(requests)}">No requests submitted yet.</div></main></body></html>
