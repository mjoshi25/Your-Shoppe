<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My requests | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="jobs-page"><h1>My requests</h1><div class="community-grid"><article class="community-card" th:each="r : ${requests}"><div><span class="status-line" th:text="${r.status}">SUBMITTED</span><h2 th:text="${r.type}">Type</h2><p th:if="${r.ticketReference != null}"><strong th:text="${'Ticket reference: ' + r.ticketReference}"></strong></p><p th:text="${r.message}">Message</p><p th:if="${r.quantity != null}" th:text="${'Quantity: ' + r.quantity}"></p><p th:if="${r.pickupAddress != null}" th:text="${'Pickup: ' + r.pickupAddress}"></p><p th:if="${r.dropAddress != null}" th:text="${'Drop: ' + r.dropAddress}"></p></div></article></div><div class="empty-state" th:if="${#lists.isEmpty(requests)}">No requests submitted yet.</div></main></body></html>
