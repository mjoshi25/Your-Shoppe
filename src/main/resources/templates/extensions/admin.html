<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Marketplace modules moderation | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="jobs-page"><section class="jobs-hero"><h1>Marketplace modules moderation</h1><p>Review events, courses, wholesale suppliers, delivery providers and freelancer profiles.</p><div th:if="${success}" class="alert alert-success" th:text="${success}"></div></section><section class="job-panel"><h2>Submitted listings</h2><article class="interview-round" th:each="item : ${items}"><span class="status-line" th:text="${item.status}">PENDING</span><h3 th:text="${item.title}">Title</h3><p th:text="${item.type + ' · ' + item.category + ' · ' + item.city}"></p><p th:text="${item.description}"></p><form class="inline-form" method="post" th:action="@{'/admin/marketplace-extensions/' + ${item.id} + '/status'}"><select name="status"><option value="APPROVED">Approve</option><option value="REJECTED">Reject</option><option value="SUSPENDED">Suspend</option><option value="CLOSED">Close</option></select><button class="btn btn-small" type="submit">Update listing</button></form></article><p class="empty-state" th:if="${#lists.isEmpty(items)}">No module listings submitted.</p></section><section class="job-panel"><h2>Bookings, enrolments, quotes and delivery/project requests</h2><article class="interview-round" th:each="r : ${requests}"><span class="status-line" th:text="${r.status}">SUBMITTED</span><h3 th:text="${r.type + ' request'}">Request</h3><p th:text="${r.requesterName + ' · ' + r.requesterEmail}"></p><p th:text="${r.message}"></p><p th:if="${r.quantity != null}" th:text="${'Quantity: ' + r.quantity}"></p><form class="inline-form" method="post" th:action="@{'/admin/marketplace-extension-requests/' + ${r.id} + '/status'}"><select name="status"><option value="CONFIRMED">Confirm / issue ticket reference</option><option value="QUOTED">Quote sent</option><option value="IN_PROGRESS">In progress</option><option value="COMPLETED">Complete</option><option value="CANCELLED">Cancel</option></select><button class="btn btn-small" type="submit">Update request</button></form></article><p class="empty-state" th:if="${#lists.isEmpty(requests)}">No requests received.</p></section></main></body></html>
