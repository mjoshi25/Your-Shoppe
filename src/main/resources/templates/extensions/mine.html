<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<meta name="theme-color" content="#421064">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My marketplace activity | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css(v=57)}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="jobs-page"><section class="jobs-hero"><h1>My marketplace activity</h1><p>Track your event, course, wholesale, delivery and professional listings.</p><a class="btn" th:href="@{/marketplace-extension-requests}">My requests</a></section><div class="community-grid"><article class="community-card" th:each="item : ${items}"><div><span class="status-line" th:text="${item.status}">PENDING</span><h2 th:text="${item.title}">Title</h2><p th:text="${item.type}">Type</p><p th:text="${item.city}">City</p><p th:text="${item.description}">Description</p><div class="listing-actions" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><a class="btn" th:href="@{/my-marketplace-listings/{id}(id=${item.id})}">View full details</a><a class="btn btn-small" th:if="${item.status != 'APPROVED'}" th:href="@{/marketplace/{id}/edit(id=${item.id})}">Edit</a><form th:if="${item.status != 'APPROVED'}" method="post" th:action="@{/marketplace/{id}/delete(id=${item.id})}" onsubmit="return confirm('Delete this unapproved listing? This cannot be undone.');"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-small" type="submit">Delete</button></form><span class="muted" th:if="${item.status == 'APPROVED'}">Approved — editing and deletion are locked.</span></div></div></article></div><div class="empty-state" th:if="${#lists.isEmpty(items)}">You have not submitted any listings yet.</div></main></body></html>
