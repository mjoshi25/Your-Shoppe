<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<meta name="theme-color" content="#421064">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submit listing | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css(v=57)}">
<style>
.extension-form .field-help{display:block;color:#756b7c;font-size:.85rem;margin-top:.3rem}.image-upload{border:1px dashed #b9a8c8;border-radius:12px;padding:14px;background:#fcfaff}.image-preview{display:none;max-width:100%;max-height:220px;object-fit:contain;border-radius:10px;margin-top:12px}.category-note{padding:10px 12px;border-radius:8px;background:#fff7e8;color:#805300;font-size:.9rem}.extension-form select:disabled{opacity:.65}
</style>
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="jobs-page"><section class="job-panel">
<span class="eyebrow">PUBLISH ON ASMJ SHOPPE</span><h1 th:text="${'Submit: ' + moduleTitle}">Submit listing</h1>
<p>Your submission will be reviewed by the admin team before it appears publicly.</p>
<div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
<form class="job-form extension-form" method="post" enctype="multipart/form-data" th:action="@{/marketplace/save}" th:attr="data-module=${type}">
<input type="hidden" name="type" th:value="${type}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<label>Title<input name="title" maxlength="150" required></label>
<label>Category<select id="moduleCategory" name="category" required><option value="">Loading categories…</option></select><small class="field-help">Categories are maintained by the ASMJ Shoppe administrator.</small></label>
<label>Subcategory<select id="moduleSubcategory" name="subcategory" disabled><option value="">Select a category first</option></select></label>
<div class="category-note full" id="categoryAdminNote" hidden>No active categories are configured for this module yet. Please contact the administrator to add categories and subcategories before submitting.</div>
<label>Organisation / provider<input name="organisation" maxlength="160"></label>
<label>Contact person<input name="contactName" maxlength="100"></label>
<label>Contact mobile<input name="contactMobile" maxlength="20"></label>
<label>City<input name="city" maxlength="80" required></label><label>State<input name="state" maxlength="80"></label>
<label>PIN code<input name="pinCode" maxlength="10"></label><label>Address / venue<input name="address" maxlength="300"></label>
<label>Website<input name="website" type="url" maxlength="300"></label>
<label class="full">Listing image
<div class="image-upload"><input id="imageFile" type="file" name="imageFile" accept="image/jpeg,image/png,image/webp"><small class="field-help">Upload JPG, PNG or WEBP. Maximum 5 MB. The image is stored in Cloudinary.</small><img id="imagePreview" class="image-preview" alt="Selected image preview"></div>
</label>
<label th:if="${type == 'EVENT'}">Event date<input type="date" name="eventDate"></label><label th:if="${type == 'EVENT'}">Venue<input name="venue" maxlength="250"></label><label th:if="${type == 'EVENT'}">Capacity<input type="number" min="1" name="capacity"></label><label th:if="${type == 'EVENT'}">Ticket price (INR)<input type="number" min="0" step="0.01" name="price"></label>
<label th:if="${type == 'COURSE'}">Course level<input name="courseLevel" placeholder="Beginner / Intermediate / Advanced"></label><label th:if="${type == 'COURSE'}">Mode<select name="mode"><option value="">Select</option><option>Online</option><option>Offline</option><option>Hybrid</option></select></label><label th:if="${type == 'COURSE'}">Duration<input name="duration" placeholder="e.g. 8 weeks"></label><label th:if="${type == 'COURSE'}">Start date<input type="date" name="startDate"></label><label th:if="${type == 'COURSE'}">End date<input type="date" name="endDate"></label><label th:if="${type == 'COURSE'}">Course fee (INR)<input type="number" min="0" step="0.01" name="price"></label>
<label th:if="${type == 'WHOLESALE'}">Product / supply details<input name="skills" placeholder="Brands, specifications, variants"></label><label th:if="${type == 'WHOLESALE'}">Minimum order quantity<input type="number" min="0" step="0.01" name="minOrderQuantity"></label><label th:if="${type == 'WHOLESALE'}">Indicative unit price (INR)<input type="number" min="0" step="0.01" name="price"></label>
<label th:if="${type == 'DELIVERY'}">Service coverage / PIN codes<input name="deliveryArea" maxlength="500" placeholder="Areas and PIN codes served"></label><label th:if="${type == 'DELIVERY'}">Delivery mode<input name="mode" placeholder="Two-wheeler / Van / Truck"></label><label th:if="${type == 'DELIVERY'}">Indicative starting charge (INR)<input type="number" min="0" step="0.01" name="price"></label>
<label th:if="${type == 'FREELANCE'}">Skills and services<textarea name="skills" rows="3" maxlength="1000"></textarea></label><label th:if="${type == 'FREELANCE'}">Work mode<select name="mode"><option value="">Select</option><option>Remote</option><option>Onsite</option><option>Hybrid</option></select></label><label th:if="${type == 'FREELANCE'}">Portfolio URL<input name="portfolioUrl" type="url" maxlength="500"></label><label th:if="${type == 'FREELANCE'}">Employment / engagement type<input name="employmentType" placeholder="Freelance / Contract / Project"></label><label th:if="${type == 'FREELANCE'}">Indicative starting price (INR)<input type="number" min="0" step="0.01" name="price"></label>
<label class="full">Description<textarea name="description" rows="5" maxlength="5000" required></textarea></label><label class="full">Schedule / additional details<textarea name="schedule" rows="2" maxlength="300"></textarea></label>
<div class="full" id="uploadProgressWrap" hidden><progress id="uploadProgress" max="100" value="0" style="width:100%"></progress><small id="uploadProgressText">Uploading…</small></div><button class="btn" id="submitListing" type="submit">Submit for admin approval</button>
</form></section></main>
<script>
(()=>{const form=document.querySelector('.extension-form');if(!form)return;const type=form.dataset.module;const category=document.getElementById('moduleCategory');const subcategory=document.getElementById('moduleSubcategory');const note=document.getElementById('categoryAdminNote');const submit=document.getElementById('submitListing');let categoryData=[];
const reset=(select,label)=>{select.innerHTML='';const o=document.createElement('option');o.value='';o.textContent=label;select.appendChild(o)};
fetch('/api/marketplace/categories?type='+encodeURIComponent(type),{headers:{'Accept':'application/json'}}).then(r=>{if(!r.ok)throw new Error('Unable to load categories');return r.json()}).then(rows=>{categoryData=Array.isArray(rows)?rows:[];reset(category,'Select category');categoryData.forEach(c=>{const o=document.createElement('option');o.value=c.name;o.textContent=c.name;category.appendChild(o)});if(!categoryData.length){note.hidden=false;submit.disabled=true;reset(category,'No categories configured')} }).catch(()=>{reset(category,'Categories unavailable');note.hidden=false;note.textContent='Categories could not be loaded. Please refresh or contact the administrator.';submit.disabled=true});
category.addEventListener('change',()=>{reset(subcategory,'Select subcategory (optional)');const chosen=categoryData.find(c=>c.name===category.value);const subs=chosen&&Array.isArray(chosen.subcategories)?chosen.subcategories:[];subs.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;subcategory.appendChild(o)});subcategory.disabled=!category.value||!subs.length});
const file=document.getElementById('imageFile'),preview=document.getElementById('imagePreview');file.addEventListener('change',()=>{const f=file.files&&file.files[0];if(!f){preview.removeAttribute('src');preview.style.display='none';return}if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>5*1024*1024){alert('Please choose a JPG, PNG or WEBP image up to 5 MB.');file.value='';preview.style.display='none';return}preview.src=URL.createObjectURL(f);preview.style.display='block'});form.addEventListener('submit',e=>{e.preventDefault();if(!form.reportValidity())return;const button=form.querySelector('button[type=submit]'),wrap=document.getElementById('uploadProgressWrap'),bar=document.getElementById('uploadProgress'),label=document.getElementById('uploadProgressText');button.disabled=true;wrap.hidden=false;const xhr=new XMLHttpRequest();xhr.open('POST',form.action);xhr.upload.addEventListener('progress',ev=>{if(ev.lengthComputable){const pct=Math.round(ev.loaded/ev.total*100);bar.value=pct;label.textContent='Uploading listing and image… '+pct+'%'}});xhr.addEventListener('load',()=>{if(xhr.status>=200&&xhr.status<400){window.location.href=xhr.responseURL||'/my-marketplace-listings'}else{button.disabled=false;label.textContent='Upload failed. Please try again.';alert('Unable to submit the listing. Please try again.')}});xhr.addEventListener('error',()=>{button.disabled=false;label.textContent='Network error. Please try again.';alert('Network error while submitting the listing.')});xhr.send(new FormData(form));});
})();
</script>
</body></html>
