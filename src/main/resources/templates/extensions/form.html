<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Submit listing | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="jobs-page"><section class="job-panel"><span class="eyebrow">PUBLISH ON ASMJ SHOPPE</span><h1 th:text="${'Submit: ' + moduleTitle}">Submit listing</h1><p>Your submission will be reviewed by the admin team before it appears publicly.</p><form class="job-form extension-form" method="post" th:action="@{/marketplace/save}"><input type="hidden" name="type" th:value="${type}"><label>Title<input name="title" maxlength="150" required></label><label>Category<input name="category" maxlength="100" required></label><label>Organisation / provider<input name="organisation" maxlength="160"></label><label>Contact person<input name="contactName" maxlength="100"></label><label>Contact mobile<input name="contactMobile" maxlength="20"></label><label>City<input name="city" maxlength="80" required></label><label>State<input name="state" maxlength="80"></label><label>PIN code<input name="pinCode" maxlength="10"></label><label>Address / venue<input name="address" maxlength="300"></label><label>Website<input name="website" type="url" maxlength="300"></label><label>Image URL<input name="imageUrl" type="url" maxlength="1000" placeholder="Optional HTTPS image URL"></label><label th:if="${type == 'EVENT'}">Event date<input type="date" name="eventDate"></label><label th:if="${type == 'EVENT'}">Venue<input name="venue" maxlength="250"></label><label th:if="${type == 'EVENT'}">Capacity<input type="number" min="1" name="capacity"></label><label th:if="${type == 'EVENT'}">Ticket price (INR)<input type="number" min="0" step="0.01" name="price"></label><label th:if="${type == 'COURSE'}">Course level<input name="courseLevel" placeholder="Beginner / Intermediate / Advanced"></label><label th:if="${type == 'COURSE'}">Mode<select name="mode"><option value="">Select</option><option>Online</option><option>Offline</option><option>Hybrid</option></select></label><label th:if="${type == 'COURSE'}">Duration<input name="duration" placeholder="e.g. 8 weeks"></label><label th:if="${type == 'COURSE'}">Start date<input type="date" name="startDate"></label><label th:if="${type == 'COURSE'}">End date<input type="date" name="endDate"></label><label th:if="${type == 'COURSE'}">Course fee (INR)<input type="number" min="0" step="0.01" name="price"></label><label th:if="${type == 'WHOLESALE'}">Product / supply details<input name="skills" placeholder="Brands, specifications, variants"></label><label th:if="${type == 'WHOLESALE'}">Minimum order quantity<input type="number" min="0" step="0.01" name="minOrderQuantity"></label><label th:if="${type == 'WHOLESALE'}">Indicative unit price (INR)<input type="number" min="0" step="0.01" name="price"></label><label th:if="${type == 'DELIVERY'}">Service coverage / PIN codes<input name="deliveryArea" maxlength="500" placeholder="Areas and PIN codes served"></label><label th:if="${type == 'DELIVERY'}">Delivery mode<input name="mode" placeholder="Two-wheeler / Van / Truck"></label><label th:if="${type == 'DELIVERY'}">Indicative starting charge (INR)<input type="number" min="0" step="0.01" name="price"></label><label th:if="${type == 'FREELANCE'}">Skills and services<textarea name="skills" rows="3" maxlength="1000"></textarea></label><label th:if="${type == 'FREELANCE'}">Work mode<select name="mode"><option value="">Select</option><option>Remote</option><option>Onsite</option><option>Hybrid</option></select></label><label th:if="${type == 'FREELANCE'}">Portfolio URL<input name="portfolioUrl" type="url" maxlength="500"></label><label th:if="${type == 'FREELANCE'}">Employment / engagement type<input name="employmentType" placeholder="Freelance / Contract / Project"></label><label th:if="${type == 'FREELANCE'}">Indicative starting price (INR)<input type="number" min="0" step="0.01" name="price"></label><label class="full">Description<textarea name="description" rows="5" maxlength="5000" required></textarea></label><label class="full">Schedule / additional details<textarea name="schedule" rows="2" maxlength="300"></textarea></label><button class="btn" type="submit">Submit for admin approval</button></form></section></main></body></html>
