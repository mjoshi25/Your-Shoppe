<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My orders | ASMJ Marketplace</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap"><div class="eyebrow">CUSTOMER CENTRE</div><h1>My orders</h1><div class="notice success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="notice error" th:if="${errorMessage}" th:text="${errorMessage}"></div><section class="panel" th:if="${#lists.isEmpty(orders)}"><h2>No orders yet</h2><a class="btn primary" th:href="@{/products}">Explore products</a></section><article class="panel order-card" th:each="o : ${orders}"><div class="order-head"><div><b th:text="${o.orderNumber}"></b><small th:text="${'Placed '+#temporals.format(o.createdAt,'dd MMM yyyy HH:mm')}"></small></div><span class="status-pill" th:text="${o.status}"></span></div><p>Vendor: <b th:text="${o.vendorName}"></b> · <span th:text="${o.fulfilmentMethod == 'DELIVERY' ? 'Home delivery' : 'Shop pickup'}"></span></p><ul><li th:each="i : ${o.items}" th:text="${i.productName+' × '+i.quantity+' — ₹'+#numbers.formatDecimal(i.lineTotal,1,2)}"></li></ul><div class="summary-line"><span>Subtotal</span><b th:text="${'₹'+#numbers.formatDecimal(o.subtotal,1,2)}"></b></div><div class="summary-line"><span>Delivery</span><b th:text="${'₹'+#numbers.formatDecimal(o.deliveryCharge,1,2)}"></b></div><div class="summary-line"><span>Total</span><b th:text="${'₹'+#numbers.formatDecimal(o.total,1,2)}"></b></div><p>Payment: <b th:text="${o.paymentMethod+' / '+o.paymentStatus}"></b></p><p th:if="${o.paymentMethod.name() == 'UPI' and o.upiReference != null}" class="muted" th:text="${'UPI reference: '+o.upiReference}"></p><form th:if="${o.status.name() == 'PLACED'}" method="post" th:action="@{/customer/orders/{id}/cancel(id=${o.id})}"><button class="btn secondary small-btn" onclick="return confirm('Cancel this order?')">Cancel order</button></form><div class="notice" th:if="${o.upiReference != null}"><b>UPI UTR:</b> <span th:text="${o.upiReference}"></span><a th:if="${o.paymentProofUrl != null}" th:href="${o.paymentProofUrl}" target="_blank" rel="noopener">View uploaded screenshot</a></div><div class="notice" th:if="${o.cashReceiptUrl != null}"><b>Cash receipt:</b> <a th:href="${o.cashReceiptUrl}" target="_blank" rel="noopener" th:text="${o.cashReceiptFileName}">View receipt</a></div><form th:if="${o.paymentMethod.name() == 'UPI' and o.paymentStatus.name() == 'REJECTED'}" method="post" enctype="multipart/form-data" class="form-panel" th:action="@{/customer/orders/{id}/upi-proof(id=${o.id})}"><h3>Resubmit UPI payment evidence</h3><label>Correct UTR / reference<input name="upiReference" maxlength="100" required></label><label>Payment screenshot<input type="file" name="paymentProof" accept="image/jpeg,image/png,image/webp,application/pdf" required></label><button class="btn primary small-btn" type="submit">Resubmit for verification</button></form></article></main></body></html>
