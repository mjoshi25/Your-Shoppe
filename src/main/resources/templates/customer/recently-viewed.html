<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" type="image/x-icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/favicon-192.png"><meta name="theme-color" content="#541477"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recently viewed</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap" id="main-content" tabindex="-1"><h1>Recently viewed products</h1><p class="muted" th:if="${#lists.isEmpty(products)}">Products you view while signed in will appear here.</p><div class="product-grid"><article class="product-card" th:each="p : ${products}"><img th:src="${p.imageUrl}" th:alt="${p.name}"><div class="product-card-body"><h3><a th:href="@{/products/{id}(id=${p.id})}" th:text="${p.name}"></a></h3><b th:text="${'₹'+#numbers.formatDecimal(p.price,1,2)}"></b></div></article></div></main></body></html>
