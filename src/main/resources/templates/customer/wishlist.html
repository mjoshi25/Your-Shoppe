<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<meta name="theme-color" content="#421064">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wishlist</title><link rel="stylesheet" th:href="@{/css/app.css(v=56)}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap" id="main-content" tabindex="-1"><h1>My wishlist</h1><p class="muted" th:if="${#lists.isEmpty(products)}">You have not saved any products yet.</p><div class="product-grid"><article class="product-card" th:each="p : ${products}"><img th:src="${p.imageUrl}" th:alt="${p.name}"><div class="product-card-body"><h3><a th:href="@{/products/{id}(id=${p.id})}" th:text="${p.name}"></a></h3><b th:text="${'₹'+#numbers.formatDecimal(p.price,1,2)}"></b><form method="post" th:action="@{/customer/wishlist/{id}/remove(id=${p.id})}"><button class="btn danger small-btn" type="submit">Remove</button></form></div></article></div></main></body></html>
