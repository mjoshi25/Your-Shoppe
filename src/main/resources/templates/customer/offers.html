<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" type="image/x-icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/favicon-192.png"><meta name="theme-color" content="#541477"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Offers</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap"><h1>Offers and coupons</h1><p class="muted" th:if="${#lists.isEmpty(coupons)}">There are no active offers right now.</p><article class="panel" th:each="c : ${coupons}"><h2 th:text="${c.code}"></h2><p th:text="${c.description}"></p><b th:text="${c.value}"></b> <span th:text="${c.discountType}"></span> discount<p class="muted" th:if="${c.minimumOrder != null}" th:text="${'Minimum order ₹'+c.minimumOrder}"></p><p class="muted">Coupon discounts apply only to products from shops that have opted in. Individual products may be excluded by the vendor.</p><form method="post" th:action="@{/coupon/apply}"><input type="hidden" name="code" th:value="${c.code}"><button class="btn primary" type="submit">Apply coupon</button></form></article></main></body></html>
