<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My complaints | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css(v=58)}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap" id="main-content"><h1>My complaints</h1><p class="muted">Track support requests raised against your orders.</p><section class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>Order</th><th>Subject</th><th>Description</th><th>Status</th><th>Admin response</th><th>Raised</th></tr></thead><tbody><tr th:each="c : ${complaints}"><td th:text="${c.orderNumber}"></td><td th:text="${c.subject}"></td><td th:text="${c.description}"></td><td th:text="${c.status}"></td><td th:text="${c.adminNote}"></td><td th:text="${#temporals.format(c.createdAt,'dd MMM yyyy')}"></td><tr th:if="${#lists.isEmpty(complaints)}"><td colspan="6">You have not raised any complaints.</td></tr></tbody></table></div></section></main></body></html>
