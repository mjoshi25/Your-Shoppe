<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My complaints | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css(v=79)}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap" id="main-content"><h1>My complaints</h1><p class="muted">Track support requests raised against your orders and view vendor/support replies.</p><section class="panel complaint-card" th:each="c : ${complaints}"><h2 th:text="${c.subject+' · '+c.orderNumber}"></h2><p><b>Your complaint</b></p><p class="preserve" th:text="${c.description}"></p><p><b>Status:</b> <span th:text="${c.status == T(com.asmj.marketplace.complaints.OrderComplaint.Status).UNDER_REVIEW ? 'IN PROGRESS' : c.status}"></span></p><div th:if="${c.vendorResponse != null and !#strings.isEmpty(c.vendorResponse)}"><b>Vendor reply</b><p class="preserve" th:text="${c.vendorResponse}"></p></div><div th:if="${c.adminNote != null and !#strings.isEmpty(c.adminNote)}"><b>ASMJ Shoppe support response</b><p class="preserve" th:text="${c.adminNote}"></p></div><small th:text="${#temporals.format(c.createdAt,'dd MMM yyyy')}"></small></section><p th:if="${#lists.isEmpty(complaints)}">You have not raised any complaints.</p></main><style>.complaint-card{margin:16px 0;padding:20px}.complaint-card h2{font-size:19px}.preserve{white-space:pre-wrap;overflow-wrap:anywhere}</style></body></html>
