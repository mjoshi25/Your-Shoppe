<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<meta name="theme-color" content="#421064">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Availability alerts</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap" id="main-content" tabindex="-1"><h1>Product availability alerts</h1><p class="muted">These are in-app alerts. When a vendor updates stock to a positive quantity, the subscription is marked as notified here.</p><article class="panel summary-line" th:each="a : ${alerts}"><span th:text="${a.productName}"></span><b th:text="${a.notified?'Back in stock':'Waiting for stock'}"></b><a th:href="@{/products/{id}(id=${a.productId})}">View product</a></article><p class="muted" th:if="${#lists.isEmpty(alerts)}">You have no availability subscriptions.</p></main></body></html>
