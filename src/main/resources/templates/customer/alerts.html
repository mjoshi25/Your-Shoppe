<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" type="image/x-icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/favicon-192.png"><meta name="theme-color" content="#541477"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Availability alerts</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap"><h1>Product availability alerts</h1><p class="muted">These are in-app alerts. When a vendor updates stock to a positive quantity, the subscription is marked as notified here.</p><article class="panel summary-line" th:each="a : ${alerts}"><span th:text="${a.productName}"></span><b th:text="${a.notified?'Back in stock':'Waiting for stock'}"></b><a th:href="@{/products/{id}(id=${a.productId})}">View product</a></article><p class="muted" th:if="${#lists.isEmpty(alerts)}">You have no availability subscriptions.</p></main></body></html>
