<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" type="image/x-icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/favicon-192.png"><meta name="theme-color" content="#541477"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${inboxTitle} + ' | ASMJ Shoppe'">Enquiries</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap"><div class="eyebrow">PRODUCT COMMUNICATION</div><h1 th:text="${inboxTitle}">Enquiries</h1><div class="chat-inbox" th:if="${!#lists.isEmpty(conversations)}"><a class="panel chat-inbox-item" th:each="c : ${conversations}" th:href="@{/chat/{id}(id=${c.id})}"><img th:if="${c.productImageUrl != null}" th:src="${c.productImageUrl}" alt="Product"><div><strong th:text="${c.productName}">Product</strong><p th:text="${'Buyer: ' + c.buyerName + (c.guest?' (Guest)':'')}">Buyer</p><small th:if="${!#lists.isEmpty(c.messages)}" th:text="${c.messages[c.messages.size()-1].body}">Last message</small></div><span class="status-pill" th:text="${c.messages.size() + ' messages'}">Messages</span><span class="unread-pill" th:if="${unreadCounts != null and unreadCounts[c.id] != null and unreadCounts[c.id] > 0}" th:text="${unreadCounts[c.id] + ' unread'}">1 unread</span></a></div><div class="panel" th:if="${#lists.isEmpty(conversations)}"><h2>No enquiries yet</h2><p class="muted">Product enquiries will appear here when a buyer contacts a vendor.</p></div></main></body></html>
