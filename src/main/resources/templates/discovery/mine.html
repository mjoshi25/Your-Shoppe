<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My listings | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="jobs-page"><h1>My business & classified listings</h1><div class="job-panel" th:each="item : ${items}"><h2 th:text="${item.title}">Listing</h2><p th:text="${item.type + ' · ' + item.category + ' · ' + item.status}">Status</p></div><div class="empty-state" th:if="${#lists.isEmpty(items)}">You have not submitted any listings yet.</div></main></body></html>
