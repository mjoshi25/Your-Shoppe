<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Directory moderation | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="jobs-page"><p><a class="btn btn-small" th:href="@{/admin/marketplace-categories?type=BUSINESS}">Manage business &amp; classified categories</a></p><h1>Business directory & classifieds moderation</h1><article class="job-panel" th:each="item : ${items}"><h2 th:text="${item.title}">Listing</h2><p th:text="${item.type + ' · ' + item.category + ' · ' + item.status}">Listing status</p><p th:text="${item.description}"></p><div class="job-actions"><form method="post" th:action="@{/admin/community-listings/{id}/status(id=${item.id})}"><input type="hidden" name="status" value="APPROVED"><button class="btn" type="submit">Approve</button></form><form method="post" th:action="@{/admin/community-listings/{id}/status(id=${item.id})}"><input type="hidden" name="status" value="REJECTED"><button class="btn btn-secondary" type="submit">Reject</button></form><form method="post" th:action="@{/admin/community-listings/{id}/status(id=${item.id})}"><input type="hidden" name="status" value="SUSPENDED"><button class="btn btn-secondary" type="submit">Suspend</button></form></div></article><div class="empty-state" th:if="${#lists.isEmpty(items)}">No listings submitted.</div></main></body></html>
