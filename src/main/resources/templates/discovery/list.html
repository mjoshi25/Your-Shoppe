<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<meta name="theme-color" content="#421064">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${type == 'BUSINESS' ? 'Business Directory' : 'Classifieds'} + ' | ASMJ Shoppe'">Directory | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css(v=57)}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="jobs-page"><section class="jobs-hero"><span class="eyebrow" th:text="${type == 'BUSINESS' ? 'LOCAL & NATIONAL BUSINESSES' : 'BUY • SELL • REUSE'}">DISCOVER</span><h1 th:text="${type == 'BUSINESS' ? 'Business directory' : 'Classifieds & second-hand products'}">Directory</h1><p th:text="${type == 'BUSINESS' ? 'Discover verified businesses, shops and professional services.' : 'Find pre-owned products and connect directly with sellers.'}">Discover on ASMJ Shoppe</p><a class="btn" th:href="${type == 'BUSINESS' ? '/businesses/new' : '/classifieds/new'}">Post your listing</a></section><form class="jobs-search" method="get"><input name="q" th:value="${q}" placeholder="Search listings or categories"><input name="city" th:value="${city}" placeholder="City"><button class="btn" type="submit">Search</button></form><section class="community-grid"><article class="community-card" th:each="item : ${items}"><img th:if="${item.imageUrl != null and !#strings.isEmpty(item.imageUrl)}" th:src="${item.imageUrl}" alt="Listing image"><div><span class="eyebrow" th:text="${item.category}">Category</span><span th:if="${item.subcategory != null and !#strings.isEmpty(item.subcategory)}" th:text="${' · ' + item.subcategory}"></span><h2 th:text="${item.title}">Listing title</h2><p th:text="${item.description}">Description</p><p><strong th:text="${item.city}">City</strong><span th:if="${item.state != null}" th:text="${', ' + item.state}"></span></p><p th:if="${item.price != null}"><strong th:text="${'₹' + item.price}">Price</strong><span th:if="${item.condition != null}" th:text="${' · ' + item.condition}"></span></p><p th:if="${item.contactMobile != null}" th:text="${'Contact: ' + item.contactMobile}"></p></div></article><div class="empty-state" th:if="${#lists.isEmpty(items)}">No approved listings found. Try another search or check back soon.</div></section></main></body></html>
