<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<meta name="theme-color" content="#421064">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Submit listing | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css(v=57)}"><style>.image-upload{border:1px dashed #b9a8c8;border-radius:12px;padding:14px;background:#fcfaff}.image-preview{display:none;max-width:100%;max-height:220px;object-fit:contain;border-radius:10px;margin-top:12px}.field-help{display:block;color:#756b7c;font-size:.85rem;margin-top:.3rem}.category-note{padding:10px 12px;border-radius:8px;background:#fff7e8;color:#805300;font-size:.9rem}</style></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="jobs-page"><section class="job-panel"><h1 th:text="${editing ? 'Edit listing' : (type == 'BUSINESS' ? 'Add your business' : 'Post a classified ad')}">Submit listing</h1><p>Your listing will be visible publicly after admin approval. Changes to unapproved listings are sent back for review.</p><div class="alert alert-error" th:if="${error}" th:text="${error}"></div><form class="job-form" id="communityForm" method="post" enctype="multipart/form-data" th:action="${editing ? '/community-listings/' + listing.id + '/update' : '/community-listings/save'}" th:attr="data-module=${type}"><input type="hidden" name="type" th:value="${type}"><input type="hidden" name="listingId" th:if="${editing}" th:value="${listing.id}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Title<input name="title" maxlength="120" required th:value="${listing.title}"></label><label>Category<select id="communityCategory" name="category" required th:attr="data-selected=${listing.category}"><option value="">Loading categories…</option></select></label><label>Subcategory<select id="communitySubcategory" name="subcategory" th:attr="data-selected=${listing.subcategory}" disabled><option value="">Select a category first</option></select></label><div class="category-note full" id="communityCategoryNote" hidden>No active categories are configured. Please contact the administrator.</div><label class="full">Description<textarea name="description" rows="5" maxlength="3000" required th:text="${listing.description}"></textarea></label><label>Contact person<input name="contactName" maxlength="100" th:value="${listing.contactName}"></label><label>Contact mobile<input name="contactMobile" maxlength="20" th:value="${listing.contactMobile}"></label><label>City<input name="city" maxlength="80" th:value="${listing.city}"></label><label>State<input name="state" maxlength="80" th:value="${listing.state}"></label><label>PIN code<input name="pinCode" maxlength="10" th:value="${listing.pinCode}"></label><label>Address<input name="address" maxlength="250" th:value="${listing.address}"></label><label>Website / external link<input name="website" maxlength="250" type="url" th:value="${listing.website}"></label><label class="full">Listing image<div class="image-upload"><input id="communityImage" type="file" name="imageFile" accept="image/jpeg,image/png,image/webp"><small class="field-help">JPG, PNG or WEBP, maximum 5 MB. Uploaded securely to Cloudinary.</small><img id="communityPreview" class="image-preview" alt="Selected image preview" th:if="${listing.imageUrl != null and !listing.imageUrl.isEmpty()}" th:src="${listing.imageUrl}" style="display:block"><p class="field-help" th:if="${listing.imageUrl != null and !listing.imageUrl.isEmpty()}">Current image is retained unless you choose a replacement.</p></div></label><label th:if="${type == 'CLASSIFIED'}">Product condition<select name="condition" th:attr="data-selected=${listing.condition}"><option value="">Select condition</option><option>New</option><option>Like new</option><option>Good</option><option>Fair</option><option>For parts</option></select></label><label th:if="${type == 'CLASSIFIED'}">Asking price (INR)<input name="price" type="number" min="0" step="0.01" th:value="${listing.price}"></label><div class="full" id="uploadProgressWrap" hidden><progress id="uploadProgress" max="100" value="0" style="width:100%"></progress><small id="uploadProgressText">Uploading…</small></div><button class="btn" id="communitySubmit" type="submit" th:text="${editing ? 'Save changes and resubmit' : 'Submit for approval'}">Submit for approval</button></form></section></main><script>
(()=>{const form=document.getElementById('communityForm');if(!form)return;const type=form.dataset.module,cat=document.getElementById('communityCategory'),sub=document.getElementById('communitySubcategory'),note=document.getElementById('communityCategoryNote'),submit=document.getElementById('communitySubmit');let rows=[];const reset=(el,label)=>{el.innerHTML='';const o=document.createElement('option');o.value='';o.textContent=label;el.appendChild(o)};fetch('/api/community/categories?type='+encodeURIComponent(type),{headers:{Accept:'application/json'}}).then(r=>{if(!r.ok)throw new Error();return r.json()}).then(data=>{rows=Array.isArray(data)?data:[];reset(cat,'Select category');rows.forEach(c=>{const o=document.createElement('option');o.value=c.name;o.textContent=c.name;cat.appendChild(o)});const selectedCategory=cat.dataset.selected||'';if(selectedCategory){cat.value=selectedCategory;cat.dispatchEvent(new Event('change'));}if(!rows.length){reset(cat,'No categories configured');note.hidden=false;submit.disabled=true}}).catch(()=>{reset(cat,'Categories unavailable');note.hidden=false;note.textContent='Unable to load categories. Refresh the page or contact the administrator.';submit.disabled=true});cat.addEventListener('change',()=>{reset(sub,'Select subcategory (optional)');const c=rows.find(x=>x.name===cat.value),values=c&&Array.isArray(c.subcategories)?c.subcategories:[];values.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;sub.appendChild(o)});sub.disabled=!cat.value||!values.length;if(sub.dataset.selected){sub.value=sub.dataset.selected;}});const condition=document.querySelector('select[name=condition]');if(condition&&condition.dataset.selected)condition.value=condition.dataset.selected;const file=document.getElementById('communityImage'),preview=document.getElementById('communityPreview');file.addEventListener('change',()=>{const f=file.files&&file.files[0];if(!f){preview.style.display='none';return}if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>5*1024*1024){alert('Choose a JPG, PNG or WEBP image up to 5 MB.');file.value='';preview.style.display='none';return}preview.src=URL.createObjectURL(f);preview.style.display='block'});form.addEventListener('submit',e=>{e.preventDefault();if(!form.reportValidity())return;const button=form.querySelector('button[type=submit]'),wrap=document.getElementById('uploadProgressWrap'),bar=document.getElementById('uploadProgress'),label=document.getElementById('uploadProgressText');button.disabled=true;wrap.hidden=false;const xhr=new XMLHttpRequest();xhr.open('POST',form.action);xhr.upload.addEventListener('progress',ev=>{if(ev.lengthComputable){const pct=Math.round(ev.loaded/ev.total*100);bar.value=pct;label.textContent='Uploading listing and image… '+pct+'%'}});xhr.addEventListener('load',()=>{if(xhr.status>=200&&xhr.status<400){window.location.href=xhr.responseURL||'/my-marketplace-listings'}else{button.disabled=false;label.textContent='Upload failed. Please try again.';alert('Unable to submit the listing. Please try again.')}});xhr.addEventListener('error',()=>{button.disabled=false;label.textContent='Network error. Please try again.';alert('Network error while submitting the listing.')});xhr.send(new FormData(form));});})();
</script></body></html>
