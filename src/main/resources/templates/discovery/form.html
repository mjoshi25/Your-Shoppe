<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Submit listing | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="jobs-page"><section class="job-panel"><h1 th:text="${type == 'BUSINESS' ? 'Add your business' : 'Post a classified ad'}">Submit listing</h1><p>Your listing will be visible publicly after admin approval.</p><form class="job-form" method="post" th:action="@{/community-listings/save}"><input type="hidden" name="type" th:value="${type}"><label>Title<input name="title" maxlength="120" required></label><label>Category<input name="category" maxlength="80" required placeholder="e.g. Retail, Electronics, Furniture"></label><label class="full">Description<textarea name="description" rows="5" maxlength="3000" required></textarea></label><label>Contact person<input name="contactName" maxlength="100"></label><label>Contact mobile<input name="contactMobile" maxlength="20"></label><label>City<input name="city" maxlength="80"></label><label>State<input name="state" maxlength="80"></label><label>PIN code<input name="pinCode" maxlength="10"></label><label>Address<input name="address" maxlength="250"></label><label>Website / external link<input name="website" maxlength="250" type="url"></label><label>Image URL<input name="imageUrl" maxlength="1000" type="url" placeholder="Optional image URL"></label><label th:if="${type == 'CLASSIFIED'}">Product condition<select name="condition"><option value="">Select condition</option><option>New</option><option>Like new</option><option>Good</option><option>Fair</option><option>For parts</option></select></label><label th:if="${type == 'CLASSIFIED'}">Asking price (INR)<input name="price" type="number" min="0" step="0.01"></label><button class="btn" type="submit">Submit for approval</button></form></section></main></body></html>
