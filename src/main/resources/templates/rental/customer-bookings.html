<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<meta name="theme-color" content="#421064">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My rental bookings | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap rental-wrap"><div class="eyebrow">CUSTOMER CENTRE</div><h1>My rental bookings</h1><div class="notice success" th:if="${successMessage}" th:text="${successMessage}"></div><article class="panel rental-booking-card" th:each="b : ${bookings}"><div class="order-head"><div><b th:text="${b.bookingNumber}"></b><small th:text="${b.vehicleName+' · '+b.vehicleCategory}"></small></div><span class="status-pill" th:text="${b.status}"></span></div><p><b>Pickup:</b> <span th:text="${b.pickupAddress+' ('+b.pickupPinCode+')'}"></span> · <a target="_blank" rel="noopener" th:href="${'https://www.google.com/maps/search/?api=1&query='+b.pickupLatitude+','+b.pickupLongitude}">Map</a></p><p><b>Drop:</b> <span th:text="${b.dropAddress+' ('+b.dropPinCode+')'}"></span> · <a target="_blank" rel="noopener" th:href="${'https://www.google.com/maps/search/?api=1&query='+b.dropLatitude+','+b.dropLongitude}">Map</a></p><p><b>Trip:</b> <span th:text="${b.tripType+' · '+b.pickupDate+' '+b.pickupTime}"></span><span th:if="${b.returnDate != null}" th:text="${' · Return '+b.returnDate+' '+b.returnTime}"></span></p><p><b>Distance:</b> <span th:text="${#numbers.formatDecimal(b.distanceKm,1,2)+' km (one way)'}"></span> · <b>Estimate:</b> <span th:text="${'₹'+#numbers.formatDecimal(b.estimatedFare,1,2)}"></span></p><p th:if="${b.ownerQuotedFare != null}"><b>Owner's final quote:</b> <span th:text="${'₹'+#numbers.formatDecimal(b.ownerQuotedFare,1,2)}"></span></p><p class="muted" th:if="${b.ownerResponseNote != null and !#strings.isEmpty(b.ownerResponseNote)}" th:text="${'Owner note: '+b.ownerResponseNote}"></p><p th:if="${b.status == 'QUOTED'}"><b>Owner quote:</b> <span th:text="${'₹'+#numbers.formatDecimal(b.ownerQuotedFare,1,2)}"></span></p>
<form th:if="${b.status == 'QUOTED'}" method="post" th:action="@{/customer/rentals/{id}/quote/accept(id=${b.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn primary small-btn">Accept owner's quote</button></form>
<form th:if="${b.status == 'CONFIRMED' and (b.paymentStatus == 'PENDING' or b.paymentStatus == 'REJECTED')}" method="post" enctype="multipart/form-data" th:action="@{/customer/rentals/{id}/payment(id=${b.id})}" class="form-grid"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Payment method<select name="paymentMethod"><option value="UPI">UPI paid directly to owner</option><option value="CASH">Cash on trip</option></select></label><label>Exact quoted amount (₹)<input type="number" name="amountPaid" step="0.01" min="1" th:value="${b.ownerQuotedFare}" required></label><label>UPI UTR/reference<input name="utr" maxlength="30"></label><label>UPI screenshot<input type="file" name="proof" accept="image/*,.pdf"></label><button class="btn primary small-btn">Submit payment details</button></form>
<p th:if="${b.paymentStatus != null}" class="muted" th:text="${'Payment: '+b.paymentStatus}"></p>
<form th:if="${b.status == 'REQUESTED' or b.status == 'QUOTED' or b.status == 'CONFIRMED'}" method="post" th:action="@{/customer/rentals/{id}/cancel(id=${b.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Cancellation reason<input name="reason" maxlength="250"></label><button class="btn danger small-btn" type="submit" onclick="return confirm('Cancel this rental request?')">Cancel booking</button></form>
<small class="muted">Pay the vehicle owner directly. ASMJ Shoppe does not collect rental fare in this workflow.</small></article><section class="panel" th:if="${#lists.isEmpty(bookings)}"><h2>No rental requests yet</h2><a class="btn primary" th:href="@{/rentals}">Browse rental vehicles</a></section></main></body></html>
