<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My rental bookings | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap rental-wrap"><div class="eyebrow">CUSTOMER CENTRE</div><h1>My rental bookings</h1><div class="notice success" th:if="${successMessage}" th:text="${successMessage}"></div><article class="panel rental-booking-card" th:each="b : ${bookings}"><div class="order-head"><div><b th:text="${b.bookingNumber}"></b><small th:text="${b.vehicleName+' · '+b.vehicleCategory}"></small></div><span class="status-pill" th:text="${b.status}"></span></div><p><b>Pickup:</b> <span th:text="${b.pickupAddress+' ('+b.pickupPinCode+')'}"></span></p><p><b>Drop:</b> <span th:text="${b.dropAddress+' ('+b.dropPinCode+')'}"></span></p><p><b>Trip:</b> <span th:text="${b.tripType+' · '+b.pickupDate+' '+b.pickupTime}"></span><span th:if="${b.returnDate != null}" th:text="${' · Return '+b.returnDate+' '+b.returnTime}"></span></p><p><b>Distance:</b> <span th:text="${#numbers.formatDecimal(b.distanceKm,1,2)+' km (one way)'}"></span> · <b>Estimate:</b> <span th:text="${'₹'+#numbers.formatDecimal(b.estimatedFare,1,2)}"></span></p><p th:if="${b.ownerQuotedFare != null}"><b>Owner's final quote:</b> <span th:text="${'₹'+#numbers.formatDecimal(b.ownerQuotedFare,1,2)}"></span></p><p class="muted" th:if="${b.ownerResponseNote != null and !#strings.isEmpty(b.ownerResponseNote)}" th:text="${'Owner note: '+b.ownerResponseNote}"></p><small class="muted">Payment is arranged after the owner confirms the booking. This request does not collect payment.</small></article><section class="panel" th:if="${#lists.isEmpty(bookings)}"><h2>No rental requests yet</h2><a class="btn primary" th:href="@{/rentals}">Browse rental vehicles</a></section></main></body></html>
