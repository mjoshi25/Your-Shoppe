<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Approval requests | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap" id="main-content"><div class="eyebrow">MY ACCOUNT</div><h1>Approval requests</h1><p class="muted">Track your approval submissions, respond to Admin clarification requests and upload supporting documents.</p><div th:if="${successMessage}" class="notice" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="notice error" th:text="${errorMessage}"></div><p><a class="btn primary" th:href="@{/my-approval-requests/new}">＋ Submit an item for Admin approval</a></p><section class="panel"><div class="table-wrap"><table><thead><tr><th>Item</th><th>Module</th><th>Status</th><th>Updated</th><th></th></tr></thead><tbody><tr th:each="c : ${cases}"><td th:text="${c.subjectTitle}"></td><td th:text="${c.module}"></td><td th:text="${c.status}"></td><td th:text="${c.updatedAt}"></td><td><a th:href="@{/my-approval-requests/{id}(id=${c.id})}">View / respond →</a></td></tr><tr th:if="${#lists.isEmpty(cases)}"><td colspan="5">You have not submitted any approval requests yet.</td></tr></tbody></table></div></section></main></body></html>
