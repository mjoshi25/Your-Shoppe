<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<meta name="theme-color" content="#421064">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submit for approval | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css(v=56)}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap" id="main-content"><a th:href="@{/my-approval-requests}">← My approval requests</a><div class="eyebrow">SUBMIT TO ADMIN</div><h1>Submit an item for approval</h1><p class="muted">Submit an existing item that belongs to your account. Admin will receive it for review.</p><div th:if="${errorMessage}" class="notice error" th:text="${errorMessage}"></div><form class="panel form-grid" method="post" enctype="multipart/form-data" th:action="@{/my-approval-requests/new}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="field">Module<select name="module" required><option th:each="o : ${moduleOptions}" th:value="${o.code}" th:text="${o.label}"></option></select></label><label class="field">Record type<input name="subjectType" required maxlength="80" placeholder="e.g. RentalVehicle"></label><label class="field">Record ID<input name="subjectId" required maxlength="120" placeholder="ID of your saved item"></label><label class="field" style="grid-column:1/-1">Message to Admin<textarea name="message" rows="4" maxlength="3000" placeholder="Describe your submission or explain any supporting information..."></textarea></label><label class="field" style="grid-column:1/-1">Supporting documents<input type="file" name="files" multiple accept=".jpg,.jpeg,.png,.webp,.pdf,.txt,.doc,.docx"><small>JPG, PNG, WEBP, PDF, TXT, DOC or DOCX. Maximum 8 MB each.</small></label><div><button class="btn primary" type="submit">Submit for Admin approval</button> <a class="btn secondary" th:href="@{/my-approval-requests}">Cancel</a></div></form></main></body></html>
