<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<meta name="theme-color" content="#421064">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Respond to approval request | ASMJ Shoppe</title><link rel="stylesheet" th:href="@{/css/app.css(v=57)}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="dashboard-wrap" id="main-content"><a th:href="@{/my-approval-requests}">← My approval requests</a><div class="eyebrow">ADMIN REQUEST</div><h1 th:text="${approvalCase.subjectTitle}">Approval item</h1><p><b>Module:</b> <span th:text="${approvalCase.module}"></span> · <b>Status:</b> <span th:text="${approvalCase.status}"></span></p><div th:if="${successMessage}" class="notice" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="notice error" th:text="${errorMessage}"></div><section class="panel"><h2>Information requested by admin</h2><p style="white-space:pre-wrap" th:text="${approvalCase.latestAdminMessage}"></p><h3>Reference documents</h3><ul><li th:each="f : ${approvalCase.attachments}"><a th:href="${f.url}" target="_blank" rel="noopener" th:text="${f.fileName}"></a></li><li th:if="${#lists.isEmpty(approvalCase.attachments)}">No reference documents attached.</li></ul></section><section class="panel"><h2>History</h2><article th:each="h : ${approvalCase.history}" class="dashboard-status-panel"><b th:text="${h.action+' · '+h.actorRole}"></b><p th:text="${h.message}"></p><small th:text="${h.createdAt}"></small><ul><li th:each="f : ${h.attachments}"><a th:href="${f.url}" target="_blank" rel="noopener" th:text="${f.fileName}"></a></li></ul></article></section><section class="panel" th:if="${approvalCase.status == 'ACTION_REQUIRED'}"><h2>Submit your response</h2><form method="post" enctype="multipart/form-data" th:action="@{/my-approval-requests/{id}/respond(id=${approvalCase.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="field">Your response<textarea name="message" rows="4" maxlength="3000" placeholder="Provide the requested information..."></textarea></label><label class="field">Supporting documents<input type="file" name="files" multiple accept=".jpg,.jpeg,.png,.webp,.pdf,.txt,.doc,.docx"><small>JPG, PNG, WEBP, PDF, TXT, DOC or DOCX · Maximum 8 MB each</small></label><button class="btn primary" type="submit">Submit for admin review</button></form></section><p class="notice" th:if="${approvalCase.status == 'SUBMITTED'}">Your response has been submitted and is awaiting admin review.</p></main></body></html>
