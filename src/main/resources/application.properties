spring.application.name=asmj-marketplace
server.port=${PORT:8080}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/asmj_marketplace}
spring.data.mongodb.auto-index-creation=true

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.mvc.hiddenmethod.filter.enabled=true

app.bootstrap-admin.email=${APP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_ADMIN_PASSWORD:}
app.bootstrap-admin.name=${APP_ADMIN_NAME:Marketplace Admin}

server.error.whitelabel.enabled=false

# Cloudinary image storage (set these as environment variables in Render)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=12MB

# Product moderation: true means new listings wait for admin approval
app.products.require-approval=${APP_PRODUCTS_REQUIRE_APPROVAL:true}
